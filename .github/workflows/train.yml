name: Train Model

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      config:
        description: 'Config file to use'
        required: false
        default: 'configs/settings.yaml'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install -e . --no-deps

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          MT5_LOGIN=${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD=${{ secrets.MT5_PASSWORD }}
          MT5_SERVER=${{ secrets.MT5_SERVER }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EOF

      - name: Run training
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CONFIG=${{ github.event.inputs.config || 'configs/settings.yaml' }}
          python src/xauusd_ai/main.py train --config "$CONFIG"

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-artifacts-${{ github.run_number }}
          path: |
            outputs/model.pkl
            outputs/training_report.json
            outputs/model_meta.json
            outputs/training_dataset.csv
          retention-days: 30

      - name: Notify Telegram on success
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ Training hoàn thành (run #${{ github.run_number }}) — tải model tại GitHub Actions artifacts"

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ Training THẤT BẠI (run #${{ github.run_number }}) — xem log tại GitHub Actions"
