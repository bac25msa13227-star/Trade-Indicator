let filtered = DATA.map((r,i) => [i+1,...r]);
let sortCol = -1, sortAsc = true, page = 0, pageSize = 100;

function applyFilter() {
  const q = document.getElementById('search').value.toLowerCase();
  const fold = document.getElementById('fFold').value;
  const side = document.getElementById('fSide').value;
  const outcome = document.getElementById('fOutcome').value;
  filtered = DATA.map((r,i) => [i+1,...r]).filter(r => {
    if (fold && String(r[2]) !== fold) return false;
    if (side && r[3] !== side) return false;
    if (outcome && r[10] !== outcome) return false;
    if (q && !r.join('|').toLowerCase().includes(q)) return false;
    return true;
  });
  page = 0; render();
}

function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  filtered.sort((a, b) => {
    let av = a[col], bv = b[col];
    const n = parseFloat(String(av).replace(/[^0-9.\-]/g,'')),
          m = parseFloat(String(bv).replace(/[^0-9.\-]/g,''));
    if (!isNaN(n) && !isNaN(m)) return sortAsc ? n - m : m - n;
    return sortAsc ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
  });
  render();
}

function render() {
  const start = page * pageSize, end = Math.min(start + pageSize, filtered.length);
  document.getElementById('tbody').innerHTML = filtered.slice(start, end).map(r => {
    const o = r[10];
    const cls = o === 'win' ? 'win' : o === 'loss' ? 'loss' : 'draw';
    const rrN = parseFloat(r[5]); const pnlN = parseFloat(String(r[6]).replace(/[^0-9.\-]/g,''));
    const rrCls = rrN >= 0 ? 'green' : 'red', pnlCls = pnlN >= 0 ? 'green' : 'red';
    const resCls = o === 'win' ? 'badge-win' : o === 'loss' ? 'badge-loss' : 'badge-draw';
    const icon = o === 'win' ? '✓' : o === 'loss' ? '✗' : '—';
    const ddN = parseFloat(r[8]);
    return `<tr class="${cls}">
      <td class="gray">${r[0]}</td>
      <td>${r[1]}</td>
      <td class="blue">F${r[2]}</td>
      <td class="${r[3]==='BUY'?'side-buy':'side-sell'}">${r[3]}</td>
      <td class="gray">${r[4]}</td>
      <td class="${rrCls}" style="font-weight:700">${r[5]}</td>
      <td class="${pnlCls}">${r[6]}</td>
      <td class="blue">${r[7]}</td>
      <td class="${ddN>10?'yellow':'gray'}">${r[8]}</td>
      <td class="gray">${r[9]}</td>
      <td class="${resCls}">${icon} ${o}</td>
      <td class="gray" style="font-size:0.71rem">${r[11]}</td>
    </tr>`;
  }).join('');
  document.getElementById('pageInfo').textContent =
    `Trang ${page+1}/${Math.ceil(filtered.length/pageSize)} (${start+1}–${end} / ${filtered.length.toLocaleString()})`;
  document.getElementById('info').textContent = `${filtered.length.toLocaleString()} trades`;
  document.getElementById('btnPrev').disabled = page === 0;
  document.getElementById('btnNext').disabled = end >= filtered.length;
}
function prevPage() { page--; render(); document.querySelector('.wrap').scrollTop=0; }
function nextPage() { page++; render(); document.querySelector('.wrap').scrollTop=0; }
function changePageSize() { pageSize = +document.getElementById('pageSize').value; page=0; render(); }
