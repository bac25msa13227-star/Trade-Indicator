[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    --verbose
    --strict-markers
    --strict-config
    --cov=src/xauusd_ai
    --cov-report=term-missing:skip-covered
    --cov-report=html:coverage_html
    --cov-report=json:coverage.json
    --cov-fail-under=70
    -n auto
    --dist=loadgroup

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, with dependencies)
    e2e: End-to-end tests (slowest, full workflow)
    slow: Slow-running tests (>1s)
    requires_mt5: Tests requiring MT5 connection
    requires_db: Tests requiring database
    requires_mlflow: Tests requiring MLflow

# Timeout
timeout = 300
timeout_method = thread

# Coverage options
[coverage:run]
source = src/xauusd_ai
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    */dist-packages/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = coverage_html
