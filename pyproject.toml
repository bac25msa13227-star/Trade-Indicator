[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-ai"
version = "0.1.0"
description = "Configurable AI-assisted XAUUSD trading system with MT5 integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.3",
  "numpy>=1.26.4",
  "scikit-learn>=1.5.2",
  "PyYAML>=6.0.2",
  "pydantic>=2.9.2",
  "requests>=2.32.3",
  "matplotlib>=3.9.2",
  "python-dotenv>=1.0.1",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.41.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
