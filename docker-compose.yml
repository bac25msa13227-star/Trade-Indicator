services:

  # ════════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE SERVICES
  # ════════════════════════════════════════════════════════════════════════════

  # ── PostgreSQL: trade/signal/status persistence ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: xauusd-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO: object storage (model artifacts, datasets, reports) ────────────
  minio:
    image: minio/minio:latest
    container_name: xauusd-minio
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # MinIO Console UI
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── MLflow: experiment tracking + model registry ──────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: xauusd-mlflow:latest
    container_name: xauusd-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-trader_secret}@postgres:5432/${POSTGRES_DB:-tradedb}
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  # ── Prometheus: metrics scraping ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: xauusd-prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ── Grafana: dashboards ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: xauusd-grafana
    depends_on:
      - prometheus
      - postgres
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # AIRFLOW (workflow orchestration)
  # ════════════════════════════════════════════════════════════════════════════

  airflow-init:
    image: apache/airflow:2.9.1-python3.11
    container_name: xauusd-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-trader_secret}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./outputs:/opt/airflow/outputs
      - airflow_logs:/opt/airflow/logs
    command: version
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.9.1-python3.11
    container_name: xauusd-airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-trader_secret}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TRADING_ACCOUNT: ${TRADING_ACCOUNT:-acc2}
      SETTINGS_PATH: configs/live_acc2.yaml
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./outputs:/opt/airflow/outputs
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.9.1-python3.11
    container_name: xauusd-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-trader_secret}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TRADING_ACCOUNT: ${TRADING_ACCOUNT:-acc2}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./outputs:/opt/airflow/outputs
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES
  # ════════════════════════════════════════════════════════════════════════════

  # ── FastAPI: REST API + Prometheus /metrics ───────────────────────────────
  api:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.api
    image: xauusd-api:latest
    container_name: xauusd-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./src:/app/src
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "xauusd_ai.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # ── BACKEND: Training (default config) ───────────────────────────────────
  # Lệnh: docker compose up train --build
  train:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: xauusd-backend:latest
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./src:/app/src
    command: ["python", "src/xauusd_ai/main.py", "train", "--config", "configs/settings.yaml"]

  # ── BACKEND: Training ICT+Wyckoff ─────────────────────────────────────────
  # Lệnh: docker compose up train-ict --build
  train-ict:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: xauusd-backend:latest
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./src:/app/src
    command: ["python", "src/xauusd_ai/main.py", "train", "--config", "configs/train_ict_wyckoff_2022_2026.yaml"]

  # ── BACKEND: Live Trading — ACC2 ─────────────────────────────────────────
  # Lệnh: docker compose up live -d
  live:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: xauusd-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      MLFLOW_TRACKING_URI: "file:///app/mlruns"
      TRADING_ACCOUNT: acc2
      MT5_BRIDGE_URL: "http://host.docker.internal:5601"
    volumes:
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./src:/app/src
    restart: unless-stopped
    command: ["python", "src/xauusd_ai/main.py", "live", "--config", "configs/live_acc2.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; sys.exit(0 if time.time()-os.stat('outputs/live_status_acc2.json').st_mtime<300 else 1)\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

  # ── BACKEND: Live Trading — ACC1 (aggressive, acc1_live_model.pkl) ───────
  # Lệnh: docker compose up live-acc1 -d
  live-acc1:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: xauusd-backend:latest
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      MLFLOW_TRACKING_URI: "file:///app/mlruns"
      TRADING_ACCOUNT: acc1
      MT5_BRIDGE_URL: "http://host.docker.internal:5600"
    volumes:
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./src:/app/src
    restart: unless-stopped
    command: ["python", "src/xauusd_ai/main.py", "live", "--config", "configs/live_acc1.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; sys.exit(0 if time.time()-os.stat('outputs/live_status_acc1.json').st_mtime<300 else 1)\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

  # ── BACKEND: Training — ACC1 (train_acc1.yaml — does NOT touch acc2 model) ─
  # Lệnh: docker compose run --rm train-acc1
  train-acc1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: xauusd-backend:latest
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./src:/app/src
    command: ["python", "src/xauusd_ai/main.py", "train", "--config", "configs/train_acc1.yaml"]

  # ── BACKEND: Backtest ─────────────────────────────────────────────────────
  # Lệnh: docker compose up backtest --build
  backtest:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: xauusd-backend:latest
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./src:/app/src
    command: ["python", "src/xauusd_ai/main.py", "backtest", "--config", "configs/settings.yaml"]

  # ── Nginx: reverse proxy + WebSocket edge ────────────────────────────────
  # Exposes the FastAPI dashboard on port 80 with WS upgrade support
  nginx:
    image: nginx:1.27-alpine
    container_name: xauusd-nginx
    depends_on:
      - api
    volumes:
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

  # ── Cloudflare Tunnel: public HTTPS + WSS URL ─────────────────────────────
  # Quick tunnel (no account needed) — public URL printed in container logs:
  #   docker compose up cloudflared -d
  #   docker compose logs cloudflared 2>&1 | grep trycloudflare
  #
  # Persistent domain (own Cloudflare account):
  #   1. Run once: cloudflared tunnel create trade-dashboard
  #   2. Copy the token shown, add to .env:  CLOUDFLARE_TUNNEL_TOKEN=<token>
  #   3. Change command below to:
  #      command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: xauusd-cloudflared
    depends_on:
      - nginx
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://nginx:80

  # Watches cloudflared logs and writes the tunnel URL to outputs/tunnel_url.txt
  # so bots and tunnel_notifier.py can pick it up automatically.
  tunnel-watch:
    image: alpine:3.19
    container_name: xauusd-tunnel-watch
    depends_on:
      - cloudflared
    restart: unless-stopped
    volumes:
      - ./outputs:/outputs
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache docker-cli -q
        echo "[tunnel-watch] Waiting for cloudflared logs..."
        sleep 10
        docker logs -f xauusd-cloudflared 2>&1 | \
        grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | \
        while read url; do
          echo "$$url" > /outputs/tunnel_url.txt
          echo "[tunnel-watch] URL written: $$url"
        done


  # ── Healthwatch: monitors live bots and sends Telegram alerts ─────────────
  # Lệnh: docker compose up healthwatch -d
  healthwatch:
    image: python:3.11-slim
    container_name: xauusd-healthwatch
    env_file: .env
    environment:
      HEALTHWATCH_INTERVAL: "60"
      HEALTHWATCH_MAX_STALE: "300"
      OUTPUTS_PATH: /app/outputs
    volumes:
      - ./outputs:/app/outputs:ro
      - ./scripts:/app/scripts:ro
    working_dir: /app
    restart: unless-stopped
    command: ["/bin/sh", "-c", "pip install requests -q && python scripts/healthwatch.py"]

  # ════════════════════════════════════════════════════════════════════════════
  # MICROSERVICES
  # ════════════════════════════════════════════════════════════════════════════

  # ── WF Engine: Walk-Forward run management REST API (port 8801) ───────────
  # Source: ../WFService/ (folder riêng)
  # Lệnh: docker compose up wf-engine -d
  wf-engine:
    build:
      context: ../WFService
      dockerfile: Dockerfile
    image: xauusd-wf-engine:latest
    container_name: xauusd-wf-engine
    environment:
      TRADE_INDICATOR_ROOT: /trade_indicator
    volumes:
      - .:/trade_indicator          # toàn bộ Trade Indicator (scripts/configs/outputs/.venv)
    ports:
      - "8801:8801"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8801/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Bot Engine: Live bot container management REST API (port 8802) ────────
  # Source: ../LiveBotService/ (folder riêng)
  # Lệnh: docker compose up bot-engine -d
  bot-engine:
    build:
      context: ../LiveBotService
      dockerfile: Dockerfile
    image: xauusd-bot-engine:latest
    container_name: xauusd-bot-engine
    environment:
      TRADE_INDICATOR_ROOT: /trade_indicator
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs:/trade_indicator/configs
      - ./outputs:/trade_indicator/outputs:ro
    ports:
      - "8802:8802"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8802/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  airflow_logs:
