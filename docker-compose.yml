services:

  # ── BACKEND: Training (default config) ───────────────────────────────────
  # Chạy 1 lần để train model, sau đó thoát
  # Lệnh: docker compose up train --build
  train:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: xauusd-backend:latest
    env_file: .env
    volumes:
      - ./configs:/app/configs        # mount config (sửa không cần rebuild)
      - ./outputs:/app/outputs        # model.pkl, reports lưu ra đây
      - ./src:/app/src                # hot-reload code khi dev
    command: ["python", "src/xauusd_ai/main.py", "train", "--config", "configs/settings.yaml"]

  # ── BACKEND: Training ICT+Wyckoff (2022-2025 train / 2026 test) ──────────
  # GradientBoosting + 26 features: RSI, MACD, Momentum + ICT + Wyckoff
  # Lệnh: docker compose up train-ict --build
  train-ict:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: xauusd-backend:latest
    env_file: .env
    volumes:
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./src:/app/src
    command: ["python", "src/xauusd_ai/main.py", "train", "--config", "configs/train_ict_wyckoff_2022_2026.yaml"]

  # ── BACKEND: Live Trading ─────────────────────────────────────────────────
  # Chạy liên tục, scan mỗi poll_seconds
  # Lệnh: docker compose up live -d
  # LƯU Ý: MetaTrader5 chỉ chạy trên Windows native — container Linux sẽ skip MT5
  live:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: xauusd-backend:latest      # dùng lại image đã build của train
    env_file: .env
    volumes:
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./src:/app/src
    restart: unless-stopped
    command: ["python", "src/xauusd_ai/main.py", "live", "--config", "configs/settings.yaml"]

  # ── BACKEND: Backtest ─────────────────────────────────────────────────────
  # Lệnh: docker compose up backtest --build
  backtest:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: xauusd-backend:latest
    env_file: .env
    volumes:
      - ./configs:/app/configs
      - ./outputs:/app/outputs
      - ./src:/app/src
    command: ["python", "src/xauusd_ai/main.py", "backtest", "--config", "configs/settings.yaml"]

  # ── FRONTEND: Dashboard ───────────────────────────────────────────────────
  # Build và restart độc lập với backend
  # Lệnh: docker compose up frontend --build -d
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: xauusd-frontend:latest
    env_file: .env
    volumes:
      - ./configs:/app/configs
      - ./outputs:/app/outputs        # đọc CSV/JSON từ backend để hiển thị
      - ./src:/app/src
    ports:
      - "8501:8501"
    restart: unless-stopped
