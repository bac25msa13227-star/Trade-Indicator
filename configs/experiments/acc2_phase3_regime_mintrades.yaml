# LIVE TRADING CONFIG — Account 2 (433326057 / Exness-MT5Trial7)
# Model:  outputs/acc2_live_model.pkl  (frozen production snapshot)
# Symbol: XAUUSDm  |  Phase-2 DD-tuned snapshot (Net>6k, DD<20%)
