app:
  poll_seconds: 60
  model_path:          outputs/exp_acc2_2003_model.pkl
  scaler_path:         outputs/exp_acc2_2003_scaler.pkl
  model_meta_path:     outputs/exp_acc2_2003_model_meta.json
  training_report_path: outputs/exp_acc2_2003_training_report.json
  training_plot_path:  outputs/exp_acc2_2003_training_metrics.png
  backtest_report_path: outputs/exp_acc2_2003_backtest_report.json
  backtest_trades_path: outputs/exp_acc2_2003_backtest_trades.csv
  backtest_equity_plot_path: outputs/exp_acc2_2003_backtest_equity.png
  backtest_trades_plot_path: outputs/exp_acc2_2003_backtest_trades_plot.png
  walkforward_report_path: outputs/exp_acc2_2003_walkforward_report.json
  walkforward_trades_path: outputs/exp_acc2_2003_walkforward_trades.csv
  paper_trade_log_path: outputs/paper_trade_signals_acc2.csv
  live_learning_log_path: outputs/live_learning_log_acc2.jsonl
  live_closed_trades_path: outputs/live_closed_trades_acc2.csv
  dashboard_host: 0.0.0.0
  dashboard_port: 8501
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: GC=F
  training_data_source: csv_folder
  live_data_source: yfinance
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M15
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4
  execution_timeframe: M5
  bars:
    D1: 100
    H1: 500
    H4: 200
    M30: 300
    M15: 300
    M5: 500
    M1: 200
  timezone: UTC

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20
  volatility_window: 20
  signal_threshold: 0.74             # Phase-2 DD tune (WF): tighter gate for cleaner entries
  sideways_volatility_threshold: 0.003
  strong_volatility_threshold: 0.016  # Raised: current ATR/close ~0.014 (ATR=45, price=3200)
  news_block_minutes: 0
  rsi_long_threshold: 52
  rsi_short_threshold: 48
  ict_weight: 0.40
  wyckoff_weight: 0.35
  momentum_weight: 0.25
  min_strategy_score: 0.45           # Phase-2 DD tune
  sideway_min_strategy_score: 0.10   # Phase-2 DD tune
  strong_volatility_min_strategy_score: 0.25  # Phase-2 DD tune
  require_trend_alignment: false    # Tắt — model confidence là cổng chính cho hướng
  force_trade: false
  blocked_hours_utc: [3, 15, 17, 22, 23]   # Template: block_3_17
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc: {}
  regime_shutdown_rules:
    - name: monday_early_sell_flow_conflict
      weekdays_utc: [Monday]
      hours_utc: [1, 2]
      sides: [sell]
      volatility_regimes: [1]
      trend_alignment_values: [0]
      trend_strength_max: -0.24
      execution_quality_min: 0.0
    - name: thursday_pm_sell_flow_conflict
      weekdays_utc: [Thursday]
      hours_utc: [16, 17, 18]
      sides: [sell]
      volatility_regimes: [1]
      execution_quality_min: 0.0
    - name: wed_thu_early_buy_trap
      weekdays_utc: [Wednesday, Thursday]
      hours_utc: [3, 4, 5]
      sides: [buy]
      trend_strength_max: -0.4
      execution_quality_max: 0.3
    - name: monday_0100_buy_low_adx_trap
      weekdays_utc: [Monday]
      hours_utc: [1]
      sides: [buy]
      volatility_regimes: [1]
      trend_alignment_values: [0]
      adx_max: 36.0
      execution_quality_min: 0.0
    - name: tuesday_1600_buy_regime1_misaligned
      weekdays_utc: [Tuesday]
      hours_utc: [16]
      sides: [buy]
      volatility_regimes: [1]
      trend_alignment_values: [0]
    - name: tuesday_1900_sell_sideways_trap
      weekdays_utc: [Tuesday]
      hours_utc: [19]
      sides: [sell]
      volatility_regimes: [0]
    - name: thursday_0000_sell_sideways_trap
      weekdays_utc: [Thursday]
      hours_utc: [0]
      sides: [sell]
      volatility_regimes: [0]
    - name: friday_0300_sell_sideways_trap
      weekdays_utc: [Friday]
      hours_utc: [3]
      sides: [sell]
      volatility_regimes: [0]
    - name: tue_wed_thu_sideways_buy_exhaustion
      weekdays_utc: [Tuesday, Wednesday, Thursday]
      hours_utc: [7, 8, 11, 12, 13]
      sides: [buy]
      volatility_regimes: [0]
      trend_alignment_values: [1]
      trend_strength_min: 0.4
      execution_quality_min: 0.25
  # Silver Bullet ICT windows
  silver_bullet_enabled: true
  silver_bullet_windows_utc: [[3, 4], [10, 11], [14, 15]]
  silver_bullet_confidence_boost: 0.03
  # ADX trend gate
  adx_gate_enabled: true
  adx_min_trend: 18.0               # Chỉ trade khi có xu hướng đủ rõ
  # Regime-specific confidence
  sideway_min_confidence: 0.66       # Phase-2 DD tune
  volatile_min_confidence: 0.64      # Phase-2 DD tune
  # ICT/SMC FVG hierarchy entry filter
  fvg_entry_filter_enabled: true
  fvg_filter_mode: soft
  fvg_max_refinement_rank: 3
  fvg_min_confluence_score: 1.8
  fvg_min_priority_weight: 0.25
  fvg_require_htf_alignment: true
  fvg_soft_confidence_scale: 0.08
  fvg_soft_pivot_quality: 0.60
  fvg_soft_block_side_mismatch: true

risk:
  mode: fixed_fractional
  risk_per_trade: 0.032             # Phase-2 DD tune
  risk_tier_floor: 0.014            # Phase-2 DD tune
  max_open_positions: 3             # giới hạn concurrent
  stop_loss_atr_multiple: 1.5
  take_profit_rr: 3.5              # ACC2 Model2: RR 1:3.5
  volatile_take_profit_rr: 5.0     # Volatile regime RR 1:5
  sideway_take_profit_rr: 2.5      # Sideways regime RR 1:2.5
  min_confidence: 0.62
  fixed_lot: 0.01
  max_risk_fraction: 0.058          # ~= risk_per_trade * 1.8 (optimizer behavior)
  sideway_risk_multiplier: 0.35     # Phase-2 DD tune
  normal_risk_multiplier: 1.0
  strong_volatility_risk_multiplier: 0.55
  # Circuit breaker & Capital Preservation
  daily_loss_limit_pct: 0.03        # Phase-2 DD tune
  max_drawdown_kill_pct: 0.15       # 15% drawdown → full stop (manual restart)
  consecutive_loss_pause_count: 4   # Phase-2 DD tune
  consecutive_loss_cooldown_bars: 8  # ...wait 8 bars (2h M15) before resuming
  anti_martingale_factor: 0.5        # Phase-2 DD tune
  anti_martingale_max_reductions: 3  # Max 3 reductions (down to ~21% of base risk)
  max_total_exposure_pct: 0.10       # Phase-2 DD tune
  reentry_guard_enabled: true
  reentry_cooldown_bars_after_sl: 1
  reentry_min_distance_atr: 0.35
  # Partial Take Profit
  partial_tp_enabled: true
  partial_tp_rr: 1.5                # Close 50% at 1.5R profit (was 1.0)
  partial_tp_pct: 0.5               # Close 50% of position
  risk_throttle_rules:
    - name: friday_1200_buy_regime1_misaligned
      risk_multiplier: 0.25
      weekdays_utc: [Friday]
      hours_utc: [12]
      sides: [buy]
      volatility_regimes: [1]
      trend_alignment_values: [0]
    - name: friday_1300_sell_regime1_misaligned
      risk_multiplier: 0.25
      weekdays_utc: [Friday]
      hours_utc: [13]
      sides: [sell]
      volatility_regimes: [1]
      trend_alignment_values: [0]
    - name: monday_0200_sell_regime1_bad_exec
      risk_multiplier: 0.40
      weekdays_utc: [Monday]
      hours_utc: [2]
      sides: [sell]
      volatility_regimes: [1]
      trend_alignment_values: [0]
      adx_min: 25.0
      execution_quality_max: -0.2
    - name: thursday_1800_sell_regime1_bad_exec
      risk_multiplier: 0.35
      weekdays_utc: [Thursday]
      hours_utc: [18]
      sides: [sell]
      volatility_regimes: [1]
      trend_alignment_values: [0]
      execution_quality_max: -0.05
    - name: wednesday_0100_sell_sideways_drift
      risk_multiplier: 0.25
      weekdays_utc: [Wednesday]
      hours_utc: [1]
      sides: [sell]
      volatility_regimes: [0]
      trend_alignment_values: [1]
    - name: thursday_1400_buy_regime1_midday_fade
      risk_multiplier: 0.25
      weekdays_utc: [Thursday]
      hours_utc: [14]
      sides: [buy]
      volatility_regimes: [1]
      trend_alignment_values: [1]
      probability_max: 0.60
    - name: monday_1400_sell_sideways_soften
      risk_multiplier: 0.35
      weekdays_utc: [Monday]
      hours_utc: [14]
      sides: [sell]
      volatility_regimes: [0]
      trend_alignment_values: [1]
    - name: tuesday_0000_sell_sideways_soften
      risk_multiplier: 0.35
      weekdays_utc: [Tuesday]
      hours_utc: [0]
      sides: [sell]
      volatility_regimes: [0]
      trend_alignment_values: [1]
    - name: wednesday_0400_sell_sideways_soften
      risk_multiplier: 0.35
      weekdays_utc: [Wednesday]
      hours_utc: [4]
      sides: [sell]
      volatility_regimes: [0]
      trend_alignment_values: [1]
    - name: monday_0200_sell_regime1_low_adx
      risk_multiplier: 0.35
      weekdays_utc: [Monday]
      hours_utc: [2]
      sides: [sell]
      volatility_regimes: [1]
      trend_alignment_values: [1]
      adx_max: 22.0

execution:
  auto_trade: true
  deviation: 20
  magic_number: 20260316            # Different magic number from acc1
  comment: xauusd-ai-live-acc2-freeze
  paper_trade_max_loops: 0          # 0 = run continuously until manually stopped
  paper_data_source: yfinance       # Paper test should follow live feed, not static CSV
  close_opposite_on_signal: true    # Chốt lệnh ngược chiều đang lời khi tín hiệu mới ngược hướng

  trailing_sl:
    enabled: true
    breakeven_at_rr: 0.5
    activation_rr: 1.0
    trail_atr_multiple: 1.0

  dca:
    enabled: false
    max_dca_count: 2
    trigger_atr_multiple: 1.5
    lot_multiplier: 1.5
    max_total_risk_pct: 0.03

  exit_model:
    enabled: false                  # Disabled: exit model trained on M15 scale, needs retrain for M5
    exit_model_path: "outputs/exit_model_acc2.pkl"
    exit_scaler_path: "outputs/exit_scaler_acc2.pkl"
    exit_model_meta_path: "outputs/exit_model_meta_acc2.json"
    exit_threshold: 0.65            # v2: tối ưu backtest (+$1,407 / +14.7% vs baseline)
    min_unrealized_rr: 0.80         # chỉ kiểm tra khi >= 0.8R profit (TP target = 3.5R)
    exit_min_hold_bars: 4           # không fire trong 4 bar đầu
    exit_label_horizon: 8           # nhìn 8 bars (2+ giờ) để đánh nhãn
    exit_label_threshold_rr: 0.50   # ngưỡng deterioration (phù hợp 3.5R TP)
    max_entry_samples: 8000
    also_cut_losses: false
    min_loss_rr: -0.50



training:
  # ── DATE-BASED SPLIT: long-history experiment (2003→2026) ───────────────
  train_start_date: "2003-05-05"
  train_end_date:   "2025-12-31"
  test_start_date:  "2026-01-01"
  test_end_date:    "2026-03-30"
  train_split: 0.70                  # bị bỏ qua khi dùng date split
  use_sltp_label: true
  sltp_label_max_horizon: 192        # M5: 16h = 192 bars
  label_tp_rr: 2.0                   # Label dùng RR 2.0 (dễ dự đoán hơn 3.5)
  label_horizon: 36                  # M5: 3h = 36 bars
  min_return_threshold: 0.0010       # Tăng positive rate
  retrain_on_startup: false          # Dùng model freeze hiện tại ngay khi bot khởi động
  live_learning_enabled: false       # Tắt self-learn — dùng model cố định
  live_learning_interval_minutes: 60
  live_learning_min_new_bars: 12
  live_learning_min_rows: 500
  min_self_learning_roc_auc: 0.53
  save_dataset: true
  dataset_path: outputs/training_dataset_acc2.csv
  optimize_threshold: false          # Giữ trade gate 0.72 ổn định trong live
  validation_split: 0.15
  threshold_min: 0.40                # Hạ xuống 0.40 — tăng recall signal
  threshold_max: 0.78
  threshold_step: 0.01
  min_precision_floor: 0.45          # Hạ xuống 0.45 — với RR 3.5 vẫn EV dương
  backtest_initial_balance: 200.0    # vốn khởi đầu
  walkforward_train_size: 30000
  walkforward_test_size: 4000
  walkforward_step_size: 4000
  walkforward_max_combinations: 30
  walkforward_max_folds_per_combination: 8

notifications:
