# ACC2 Scalping Config — high-frequency, direction-flip, continuous TP
# Built from: live_acc2.yaml (pf3v2 net63k base)
# Strategy: quick 1.5R TP, flip direction on reversal, all major sessions
#
# KEY changes vs base:
#   label_tp_rr 1.5→1.0 (train to predict fast 1R wins)
#   sltp_label_max_horizon 96→24 (label within 2h / 24 M5 bars)
#   take_profit_rr 10.0→1.5 (live TP aligned with training)
#   stop_loss_atr_multiple 1.2→0.8 (tighter SL = better R:R)
#   min_confidence 0.75→0.68 (more signals)
#   allowed_hours: 9→18 hours/day (London+NY+Asian)
#   partial_tp: 0.8R→take 60% → lock profit then let rest run
#   consecutive_loss_cooldown 12→4 bars (re-enter after 20 min)
#   risk_per_trade 0.06→0.15 (each trade carries weight)
#   trailing_sl activates faster (0.8R vs 1.0R)

app:
  poll_seconds: 30
  model_path: outputs/acc2_scalp_model.pkl
  scaler_path: outputs/acc2_scalp_scaler.pkl
  model_meta_path: outputs/acc2_scalp_model_meta.json
  walkforward_report_path: outputs/acc2_scalp_walkforward_report.json
  walkforward_trades_path: outputs/acc2_scalp_walkforward_trades.csv
  paper_trade_log_path: outputs/paper_trade_signals_acc2_scalp.csv
  live_learning_log_path: outputs/live_learning_log_acc2_scalp.jsonl
  live_closed_trades_path: outputs/live_closed_trades_acc2_scalp.csv
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: GC=F
  training_data_source: csv
  csv_data_path: src/xauusd_ai/real_data/XAUUSD_M5.csv
  live_data_source: yfinance
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M5
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4
  execution_timeframe: M5
  bars:
    D1: 100
    H1: 500
    H4: 200
    M30: 300
    M15: 300
    M5: 500
    M1: 200
  timezone: UTC
  enforce_market_open_gate: true
  market_tick_stale_seconds: 300
  market_preopen_alert_minutes: 30
  market_preclose_alert_minutes: 30
  market_preopen_alert_minutes_list: [1440, 30]
  market_preclose_alert_minutes_list: [1440, 30]

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20
  volatility_window: 20

  # ── Signal filtering (looser for scalping) ─────────────────────────────────
  signal_threshold: 0.68          # ↓ from 0.80 — more signals
  sideways_volatility_threshold: 0.003
  strong_volatility_threshold: 0.016
  news_block_minutes: 0

  rsi_long_threshold: 52
  rsi_short_threshold: 48
  ict_weight: 0.40
  wyckoff_weight: 0.35
  momentum_weight: 0.25
  min_strategy_score: 0.10        # ↓ from 0.15 — allow weaker setups
  sideway_min_strategy_score: 0.05
  strong_volatility_min_strategy_score: 0.15
  require_trend_alignment: false
  force_trade: false

  # ── Trading hours (18 h/day vs 9 h/day) ───────────────────────────────────
  # Covers: Asian session, London open, London/NY overlap, NY session
  blocked_hours_utc: []
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc: {}
  allowed_weekday_hours_utc:
    Monday: [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 20, 21, 22]
    Tuesday: [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 20, 21, 22]
    Wednesday: [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 20, 21, 22]
    Thursday: [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 20, 21, 22]
    Friday: [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17]

  # ── ICT Silver Bullet — precision entry windows (kept + extended) ──────────
  silver_bullet_enabled: true
  silver_bullet_windows_utc: [[3, 4], [6, 7], [10, 11], [14, 15]]
  silver_bullet_confidence_boost: 0.05  # ↑ from 0.03

  # ── ADX gate: filter out dead/choppy markets ───────────────────────────────
  adx_gate_enabled: true
  adx_min_trend: 15.0             # low threshold — scalping works in moderate trends too
  sideway_min_confidence: 0.72    # ↓ from 0.85
  volatile_min_confidence: 0.65  # ↓ from 0.75

  regime_shutdown_rules: []

risk:
  mode: fixed_fractional

  # ── Sizing ─────────────────────────────────────────────────────────────────
  risk_per_trade: 0.15            # ↑ from 0.06 — 15% per trade
  risk_tier_floor: 0.08           # min sizing floor
  max_open_positions: 3           # ↑ from 2 — allow up to 3 concurrent
  max_risk_fraction: 0.18
  max_total_exposure_pct: 0.40    # ↑ total account exposure cap

  # ── SL/TP (scalping: tight SL, quick TP) ──────────────────────────────────
  stop_loss_atr_multiple: 0.8     # ↓ from 1.2 — tighter stop
  take_profit_rr: 1.5             # ↓ from 10.0 — quick TP hit (aligned with label)
  sideway_take_profit_rr: 1.2     # tight during sideways
  volatile_take_profit_rr: 2.0    # wider during volatile (let winner run a bit)

  # ── Confidence gate ────────────────────────────────────────────────────────
  min_confidence: 0.68            # ↓ from 0.75 — more entries

  fixed_lot: 0.01
  sideway_risk_multiplier: 0.50   # ↑ from 0.20 — scalp sideways too
  normal_risk_multiplier: 1.0
  strong_volatility_risk_multiplier: 1.2  # ↑ trade bigger in volatile = more opportunity

  spread_cost_rr: 0.01
  slippage_rr: 0.01
  commission_rr: 0.0

  # ── Kill switch ────────────────────────────────────────────────────────────
  kill_switch_enabled: true
  daily_loss_limit_pct: 0.035     # 3.5% daily loss limit (scalping: tighter daily risk)
  max_drawdown_kill_pct: 0.12     # kill at 12% overall DD

  # ── Loss management (fewer pauses, faster re-entry) ────────────────────────
  consecutive_loss_pause_count: 2          # ↓ from 3
  consecutive_loss_cooldown_bars: 4        # ↓ from 12 → 20 min pause
  anti_martingale_factor: 0.3             # ↓ from 0.7 — don't cut size much after loss
  anti_martingale_max_reductions: 2

  # ── Re-entry guard (scalping: allow fast re-entry) ─────────────────────────
  reentry_guard_enabled: true
  reentry_cooldown_bars_after_sl: 1        # 5 min after SL
  reentry_min_distance_atr: 0.20           # ↓ from 0.35 — can re-enter at similar level

  # ── Partial TP — lock 60% profit at 0.8R, let 40% run to 1.5R ────────────
  partial_tp_enabled: true
  partial_tp_rr: 0.8              # take partial at 0.8R
  partial_tp_pct: 0.60            # close 60% of position

  compound_cap: 25.0              # ↓ from 50 — safer compound ceiling (25x per fold)

  risk_throttle_rules: []

execution:
  auto_trade: true
  deviation: 20
  magic_number: 20260408
  comment: xauusd-ai-acc2-scalp-v1
  paper_trade_max_loops: 0
  paper_data_source: yfinance

  # ── Direction flip: close opposite position when signal reverses ───────────
  close_opposite_on_signal: true

  # ── Trailing SL — activate early, trail tightly ──────────────────────────
  trailing_sl:
    enabled: true
    breakeven_at_rr: 0.4          # ↓ from 0.5 — move to BE sooner
    activation_rr: 0.8            # ↓ from 1.0 — start trailing sooner
    trail_atr_multiple: 0.5       # ↓ from 1.0 — tighter trail

training:
  # ── Data window: recent 3 years (more relevant for scalping patterns) ──────
  train_start_date: "2023-01-01"
  train_end_date: "2026-03-08"
  test_start_date: "2026-03-09"
  test_end_date: null

  train_split: 0.75
  use_sltp_label: true

  # ── SCALP LABEL: predict 1R win within 2h (24 M5 bars) ───────────────────
  sltp_label_max_horizon: 24      # ↓ from 96 — label within 2 hours
  label_tp_rr: 1.0                # ↓ from 1.5 — train to predict 1R TP hit

  label_horizon: 24
  min_return_threshold: 0.0008
  retrain_on_startup: true        # retrain with scalp labels on every start
  live_learning_enabled: false
  optimize_threshold: false
  save_dataset: true
  dataset_path: outputs/acc2_scalp_training_dataset.csv

  # ── WF windows (shorter for recent pattern focus) ─────────────────────────
  walkforward_train_size: 24000   # ~3 months M5 bars
  walkforward_test_size: 4000     # ~2 weeks test
  walkforward_step_size: 4000     # step 2 weeks
  walkforward_max_combinations: 30
  walkforward_max_folds_per_combination: 8
  backtest_initial_balance: 200.0

notifications:
  telegram_enabled: true
  verbose_message: true

integrations:
  mt5:
    enabled: true
    login_env: MT5_LOGIN
    password_env: MT5_PASSWORD
    server_env: MT5_SERVER
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  news:
    enabled: true
    provider: forexfactory
    minutes_before: 2
    minutes_after: 5
    trade_before_news: false
    trade_after_news: true
    high_impact_only: true
    currencies: [USD]
    news_trade_override: false
