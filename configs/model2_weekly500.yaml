# ─────────────────────────────────────────────────────────────────
# MODEL 2 — ICT + Wyckoff  |  Target: $500-$1000/week (compound)
# Vốn: $200  |  Risk: 3-5% tự động theo drawdown  |  Compound growth
#
# MỤC TIÊU:
#   Tuần 1-2 : xây vốn   ($200 → $400-700)
#   Tuần 3-4 : đạt mục tiêu ($700 → $1200-2000)
#   Tuần 5+  : $500-1000+/tuần đều đặn
#
# CHIẾN LƯỢC QUẢN LÝ VỐN:
#   - risk_per_trade  = 5% (tối đa, khi balance đang tăng)
#   - risk_tier_floor = 3% (tối thiểu, khi drawdown >= 10% từ đỉnh)
#   - Engine tự tính risk: 3% → 5% tùy drawdown (không cần can thiệp)
#   - Compound: $200 × 5% = $10/lệnh tuần 1, $600 × 5% = $30/lệnh tuần 3
# ─────────────────────────────────────────────────────────────────
app:
  model_path:              outputs/model2_weekly500.pkl
  scaler_path:             outputs/scaler2_weekly500.pkl
  model_meta_path:         outputs/model_meta2_weekly500.json
  training_report_path:    outputs/training_report_model2.json
  training_plot_path:      outputs/training_metrics_model2.png
  backtest_report_path:    outputs/backtest_report_model2.json
  backtest_trades_path:    outputs/backtest_trades_model2.csv
  backtest_equity_plot_path: outputs/backtest_equity_model2.png
  backtest_trades_plot_path: outputs/backtest_trades_plot_model2.png
  walkforward_report_path: outputs/walkforward_report_model2.json
  walkforward_trades_path: outputs/walkforward_trades_model2.csv
  paper_trade_log_path:    outputs/paper_trade_signals_model2.csv
  live_learning_log_path:  outputs/live_learning_log_model2.jsonl
  live_closed_trades_path: outputs/live_closed_trades_model2.csv
  dashboard_host: 0.0.0.0
  dashboard_port: 8501
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: XAUUSD=X
  training_data_source: csv_folder
  live_data_source: mt5
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M15
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4
  execution_timeframe: M15
  bars:
    D1: 1500
    H1: 25000
    H4: 8000
    M15: 50000
  timezone: UTC

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20
  volatility_window: 20
  signal_threshold: 0.55             # model2: thấp hơn → nhiều tín hiệu hơn/tuần
  sideways_volatility_threshold: 0.003
  strong_volatility_threshold: 0.010
  news_block_minutes: 0
  rsi_long_threshold: 52
  rsi_short_threshold: 48
  ict_weight: 0.40
  wyckoff_weight: 0.35
  momentum_weight: 0.25
  min_strategy_score: 0.05
  sideway_min_strategy_score: 0.05
  strong_volatility_min_strategy_score: 0.10
  require_trend_alignment: false
  blocked_hours_utc: []
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc: {}

risk:
  mode: fixed_fractional
  # ── Dynamic Risk Tiers (auto-scale 3% → 5% theo drawdown) ────────────────
  risk_per_trade: 0.05              # 5% = mức tối đa (khi balance đang tăng)
  risk_tier_floor: 0.03             # 3% = mức tối thiểu (khi drawdown >= 10%)
  # Engine tự tính interpolation: 3% tại 10% DD, 5% tại 0% DD
  max_open_positions: 3
  stop_loss_atr_multiple: 1.5       # SL = 1.5 × ATR
  take_profit_rr: 3.5               # RR 1:3.5 standard (cao hơn model1's 3.0)
  min_confidence: 0.60
  fixed_lot: 0.01
  max_risk_fraction: 0.08           # max 8% tổng risk mở cùng lúc
  # ── Regime-based SL/TP ───────────────────────────────────────────────────
  sideway_sl_atr_multiple: 1.0
  sideway_take_profit_rr: 2.5       # sideways: RR 2.5
  volatile_sl_atr_multiple: 2.0
  volatile_take_profit_rr: 5.0      # volatile: RR 5.0 — bắt trend mạnh
  sideway_risk_multiplier: 0.6      # giảm risk 40% khi sideways
  normal_risk_multiplier: 1.0
  strong_volatility_risk_multiplier: 0.9

execution:
  auto_trade: false
  deviation: 20
  magic_number: 20260318
  comment: xauusd-ai-model2

training:
  # ── DATE-BASED SPLIT: train 2023-2024, test 2025-2026 ────────────────────
  train_start_date: "2023-01-01"   # 2 năm gần nhất — khớp với market regime hiện tại
  train_end_date:   "2024-12-31"
  test_start_date:  "2025-01-01"   # test: toàn bộ 2025 + YTD 2026
  test_end_date:    null
  # ─────────────────────────────────────────────────────────────────────────
  train_split: 0.70
  label_horizon: 20                  # 20 × M15 = 5 giờ (dài hơn model1 — cho price thêm thời gian)
  min_return_threshold: 0.0012       # Nhãn win >= 0.12% (giống model1)
  live_learning_enabled: true
  live_learning_min_new_bars: 12
  live_learning_min_rows: 500
  save_dataset: true
  dataset_path: outputs/training_dataset_model2.csv
  optimize_threshold: true
  validation_split: 0.15
  threshold_min: 0.30                # Rất thấp → recall cao → nhiều lệnh hơn/tuần
  threshold_max: 0.75
  threshold_step: 0.01
  min_precision_floor: 0.45          # Cho phép WR thấp hơn (45%) nhưng EV vẫn dương với RR 3.5
  backtest_initial_balance: 200.0
  backtest_max_balance_multiplier: 200.0

notifications:
  telegram_enabled: false

integrations:
  mt5:
    enabled: false
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  news:
    enabled: false
    provider: stub
