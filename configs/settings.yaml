app:
  poll_seconds: 60
  model_path: outputs/model.pkl
  scaler_path: outputs/scaler.pkl
  model_meta_path: outputs/model_meta.json
  training_report_path: outputs/training_report.json
  training_plot_path: outputs/training_metrics.png
  backtest_report_path: outputs/backtest_report.json
  backtest_trades_path: outputs/backtest_trades.csv
  backtest_equity_plot_path: outputs/backtest_equity.png
  backtest_trades_plot_path: outputs/backtest_trades.png
  walkforward_report_path: outputs/walkforward_report.json
  walkforward_trades_path: outputs/walkforward_trades.csv
  paper_trade_log_path: outputs/paper_trade_signals.csv
  dashboard_host: 0.0.0.0
  dashboard_port: 8501
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: XAUUSD=X
  training_data_source: csv_folder
  live_data_source: mt5
  csv_data_path: data/xauusd_m15.csv
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M15
  higher_timeframe: D1
  mid_timeframe: H1
  execution_timeframe: M15
  bars:
    D1: 500
    H4: 1500
    H1: 2000
    M15: 5000
  timezone: UTC

strategy:
  enabled:
    ict: true
    wyckoff: true
    order_flow_proxy: true
    rsi: true
    macd: true
    news_filter: true
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 20
  swing_lookback: 10
  volatility_window: 20
  signal_threshold: 0.35          # TEST (goc: 0.55)
  sideways_volatility_threshold: 0.004
  strong_volatility_threshold: 0.012
  news_block_minutes: 0             # TEST: tat loc news (goc: 30)
  rsi_long_threshold: 45            # TEST (goc: 55)
  rsi_short_threshold: 55           # TEST (goc: 45)
  ict_weight: 0.25
  wyckoff_weight: 0.35
  momentum_weight: 0.40
  min_strategy_score: 0.02          # TEST (goc: 0.3)
  sideway_min_strategy_score: 0.01  # TEST (goc: 0.15)
  strong_volatility_min_strategy_score: 0.02  # TEST (goc: 0.2)
  require_trend_alignment: false
  blocked_hours_utc: []             # TEST: tat het block gio (goc: [7, 10, 11, 22])
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc:
    Thursday: [0, 1, 4, 6, 8, 12, 23]
    Tuesday: [16, 18]
    Wednesday: [5, 8, 9]
    Monday: [18]

risk:
  mode: fixed_fractional
  risk_per_trade: 0.0065
  max_open_positions: 3       # Toi da 3 lenh (cho tai khoan $100)
  stop_loss_atr_multiple: 1.8
  take_profit_rr: 2.2
  min_confidence: 0.30          # TEST (goc: 0.55)
  fixed_lot: 0.01               # Fallback / tối thiểu lot
  max_risk_fraction: 0.011
  # ── Lot multiplier theo regime — điều chỉnh risk thực tế ────────────────
  sideway_risk_multiplier: 0.3          # Sideway: lot giảm 70%
  normal_risk_multiplier: 0.9           # Trending: lot gần full
  strong_volatility_risk_multiplier: 0.55  # Volatile: lot giảm 45%

execution:
  auto_trade: true
  deviation: 20
  magic_number: 20260309
  comment: xauusd-ai
  paper_trade_max_loops: 500      # Số nến M15 để simulate trong paper mode
  paper_data_source: csv_folder   # "csv_folder" = dùng CSV local (không cần MT5)

  # ── Trailing Stop Loss ─────────────────────────────────────────────────────
  trailing_sl:
    enabled: true                    # Bật dịch SL tự động
    breakeven_at_rr: 0.5             # Chuyển SL về hoà vốn sau 0.5R lợi nhuận
    activation_rr: 1.0               # Bắt đầu trail sau 1.0R lợi nhuận
    trail_atr_multiple: 1.0          # Trail distance = 1.0 × ATR

  # ── DCA (Dollar Cost Averaging) ─────────────────────────────────────────
  dca:
    enabled: false                   # Tắt mặc định (rủi ro cao, bật khi hiểu rõ)
    max_dca_count: 2                 # Tối đa 2 lần DCA mỗi lệnh
    trigger_atr_multiple: 1.5        # DCA khi giá đi ngược 1.5 × ATR
    lot_multiplier: 1.5              # Lot DCA = lot trước × 1.5
    max_total_risk_pct: 0.03         # Tổng risk tối đa 3% balance

training:
  # ── Date-based split: train 2024-2025, test 2026 ──────────────────────────
  train_start_date: "2024-01-01"
  train_end_date: "2025-12-31"
  test_start_date: "2026-01-01"
  test_end_date: ~               # null = đến cuối data hiện có

  # ── Self-learning settings (bật để bot tự học từ data mới) ────────────────
  live_learning_enabled: true
  live_learning_min_new_bars: 3    # TEST: học sau 3 nến M15 (~45 phút) — gốc: 12
  live_learning_min_rows: 500      # Cần tối thiểu 500 dòng data để retrain

  # ── General ───────────────────────────────────────────────────────────────
  train_split: 0.75
  label_horizon: 12
  min_return_threshold: 0.0006
  retrain_on_startup: true
  save_dataset: true
  dataset_path: outputs/training_dataset.csv
  optimize_threshold: true
  validation_split: 0.15
  threshold_min: 0.30          # TEST (goc: 0.40)
  threshold_max: 0.60          # TEST (goc: 0.80)
  threshold_step: 0.02
  min_precision_floor: 0.30    # TEST (goc: 0.42)
  walkforward_train_size: 22000
  walkforward_test_size: 6000
  walkforward_step_size: 6000
  walkforward_ict_weights: [0.25, 0.35, 0.45]
  walkforward_wyckoff_weights: [0.15, 0.25, 0.35]
  walkforward_momentum_weights: [0.3, 0.4, 0.5]
  walkforward_min_strategy_scores: [0.1, 0.2, 0.3]
  walkforward_sideway_min_strategy_scores: [0.15, 0.25, 0.35]
  walkforward_strong_volatility_min_strategy_scores: [0.15, 0.2, 0.3]
  walkforward_min_confidences: [0.55, 0.58, 0.6]
  walkforward_require_trend_alignment: [true, false]
  walkforward_label_horizons: [6, 8, 12]
  walkforward_return_thresholds: [0.0006, 0.0008, 0.001]
  walkforward_max_combinations: 15
  walkforward_max_avg_drawdown_pct: 18.0
  walkforward_min_avg_profit_factor: 1.0
  walkforward_min_avg_precision: 0.42
  walkforward_min_avg_return_pct: 2.0
  walkforward_min_avg_trades: 25.0

notifications:
  telegram_enabled: true
  verbose_message: true

integrations:
  mt5:
    enabled: true
    login_env: MT5_LOGIN
    password_env: MT5_PASSWORD
    server_env: MT5_SERVER
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  news:
    enabled: true                # true = bật lịch tin tức
    provider: forexfactory       # Nguồn: forexfactory JSON API (miễn phí)
    cache_hours: 6               # Tự động refresh cache sau 6 giờ
    trade_before_news: false     # false = block trade trước tin | true = cho scalp
    trade_after_news: false      # false = block sau tin   | true = cho breakout
    minutes_before: 30           # Block N phút TRƯỚC tin
    minutes_after: 30            # Block N phút SAU tin
    high_impact_only: true       # Chỉ filter tin High Impact
    currencies:                  # Đồng tiền cần theo dõi
      - USD
