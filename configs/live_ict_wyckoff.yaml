# ─────────────────────────────────────────────────────────────────
# LIVE TRADING CONFIG — ICT + Wyckoff Model (28 features)
# Model:  outputs/model_ict_wyckoff.pkl (HistGBC, precision ~54%)
# Symbol: XAUUSDm  |  Exness-MT5Trial17
# ─────────────────────────────────────────────────────────────────
app:
  poll_seconds: 300             # Check mỗi 5 phút (M15 candle)
  model_path:          outputs/model_ict_wyckoff.pkl
  scaler_path:         outputs/scaler_ict_wyckoff.pkl
  model_meta_path:     outputs/model_meta_ict_wyckoff.json
  training_report_path: outputs/training_report_ict_wyckoff.json
  training_plot_path:  outputs/training_metrics_ict_wyckoff.png
  backtest_report_path: outputs/backtest_report_ict_wyckoff.json
  backtest_trades_path: outputs/backtest_trades_ict_wyckoff.csv
  backtest_equity_plot_path: outputs/backtest_equity_ict_wyckoff.png
  backtest_trades_plot_path: outputs/backtest_trades_ict_wyckoff.png
  walkforward_report_path: outputs/walkforward_report_ict_wyckoff.json
  walkforward_trades_path: outputs/walkforward_trades_ict_wyckoff.csv
  paper_trade_log_path: outputs/paper_trade_signals.csv
  live_learning_log_path: outputs/live_learning_log.jsonl
  live_closed_trades_path: outputs/live_closed_trades.csv
  dashboard_host: 0.0.0.0
  dashboard_port: 8501
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: XAUUSD=X
  training_data_source: csv_folder
  live_data_source: mt5              # Lấy data live từ MT5
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M15
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4            # ICT structure phân tích trên H4
  execution_timeframe: M15
  bars:                              # Bars lấy live (nhỏ hơn training)
    D1: 100
    H1: 500
    H4: 200
    M15: 300
  timezone: UTC

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20
  volatility_window: 20
  signal_threshold: 0.61             # Sync với trained model (threshold tối ưu từ backtest v3)
  sideways_volatility_threshold: 0.003
  strong_volatility_threshold: 0.016  # Raised: current ATR/close ~0.014 keeps triggering volatile
  news_block_minutes: 0
  rsi_long_threshold: 52
  rsi_short_threshold: 48
  ict_weight: 0.40
  wyckoff_weight: 0.35
  momentum_weight: 0.25
  min_strategy_score: 0.05          # Sync với training config — model confidence là cổng chính
  sideway_min_strategy_score: 0.05
  strong_volatility_min_strategy_score: 0.10
  require_trend_alignment: false    # Tắt — sync với training config (tránh lọc quá nhiều)
  sideway_min_confidence: 0.60      # Lower from default 0.65 to allow more trades
  volatile_min_confidence: 0.55     # Lower from 0.60 — high-ATR regime (gold bull run)
  blocked_hours_utc: [7, 10, 11, 22]  # Chặn giờ thấp chất lượng (Asia/London gap)
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc: {}

risk:
  mode: fixed_fractional
  risk_per_trade: 0.06            # 6% risk/lệnh — compound mạnh, target $6k-8k/fold
  # ── Regime-based SL/TP (thực hiện trong hybrid.py) ──
  sideway_sl_atr_multiple: 1.0
  sideway_take_profit_rr: 2.0
  volatile_sl_atr_multiple: 2.5
  volatile_take_profit_rr: 4.0
  max_open_positions: 5             # giảm concurrent để kiểm soát tốt hơn
  stop_loss_atr_multiple: 1.5
  take_profit_rr: 3.0              # RR 1:3 — tối thiểu 1:3
  min_confidence: 0.70             # Nâng ngưỡng tin cậy tối thiểu
  fixed_lot: 0.01
  max_risk_fraction: 0.08          # 8% cap tổng risk
  sideway_risk_multiplier: 0.5
  normal_risk_multiplier: 1.0
  strong_volatility_risk_multiplier: 0.8

execution:
  auto_trade: true                  # ← BẬT GIAO DỊCH THẬT
  deviation: 20
  magic_number: 20260313            # Magic number cho live session hôm nay
  comment: xauusd-ai-live

  trailing_sl:
    enabled: true                   # Bật Trailing SL
    breakeven_at_rr: 0.5            # Chuyển SL về hoà vốn sau 0.5R
    activation_rr: 1.0             # Bắt đầu trail sau 1R lời
    trail_atr_multiple: 1.0        # Trail cách 1 × ATR

  dca:
    enabled: false                  # TẮT DCA — an toàn hơn khi mới live
    max_dca_count: 2
    trigger_atr_multiple: 1.5
    lot_multiplier: 1.5
    max_total_risk_pct: 0.03

  exit_model:
    enabled: false                  # Bật sau khi train: python scripts/train_exit_model.py --config configs/live_ict_wyckoff.yaml
    exit_model_path: "outputs/exit_model.pkl"
    exit_scaler_path: "outputs/exit_scaler.pkl"
    exit_model_meta_path: "outputs/exit_model_meta.json"
    exit_threshold: 0.60            # Xác suất tối thiểu để chốt lời sớm
    min_unrealized_rr: 0.30         # Chỉ xem xét exit khi đang lời >= 0.3R
    exit_min_hold_bars: 2           # Không exit trước khi giữ lệnh ít nhất 2 nến
    also_cut_losses: false          # Tắt: không cắt lỗ sớm
    min_loss_rr: -0.50              # (Dùng khi also_cut_losses: true)

training:
  train_start_date: null
  train_end_date:   null
  test_start_date:  null
  test_end_date:    null
  train_split: 0.80
  label_horizon: 6
  min_return_threshold: 0.0006
  retrain_on_startup: true
  max_train_bars: 30000               # Cap training to 30K M5 bars (~104 days) to avoid OOM
  live_learning_enabled: true       # Bật tự học
  live_learning_interval_minutes: 30  # Tự học mỗi 30 phút
  live_learning_min_new_bars: 0      # Không dùng số nến, chỉ dùng thời gian
  live_learning_min_rows: 500
  save_dataset: false
  dataset_path: outputs/training_dataset_ict_wyckoff.csv
  optimize_threshold: true
  validation_split: 0.15
  threshold_min: 0.50              # Cho phép live learning tìm threshold thấp hơn (khớp training)
  threshold_max: 0.80
  threshold_step: 0.01
  min_precision_floor: 0.50         # Đồng bộ với training config — cho phép WR >= 50%
  backtest_initial_balance: 200.0   # vốn khởi đầu

notifications:
  telegram_enabled: true            # ← BẬT Telegram thông báo
  verbose_message: true

integrations:
  mt5:
    enabled: true                   # ← BẬT kết nối MT5
    login_env: MT5_LOGIN
    password_env: MT5_PASSWORD
    server_env: MT5_SERVER
    terminal_path: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
  telegram:
    token_env: TELEGRAM_BOT_TOKEN_ACC1
    chat_id_env: TELEGRAM_CHAT_ID_ACC1
  news:
    enabled: false
    provider: stub
