apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    uid: postgres
    database: ${POSTGRES_DB:-tradedb}
    user: ${POSTGRES_USER:-trader}
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-trader_secret}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    editable: true
