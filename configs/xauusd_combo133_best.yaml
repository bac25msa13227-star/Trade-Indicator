#   MIN_STRAT     = 0.00           # KHÔNG lọc strategy_score
#   BLOCKED       = [3,15,17,22,23] # Block giờ UTC
#   D1_GATE       = False          # D1 trend gate TẮT (counter-productive)
#
# ─── MODEL ENSEMBLE (VotingClassifier soft voting) ───────────────────────────
#   HistGradientBoostingClassifier  weight=3  max_iter=1000, lr=0.01, max_depth=7
#   RandomForestClassifier          weight=2  200 trees, max_depth=12
#   ExtraTreesClassifier            weight=1  200 trees, max_depth=14
#   + Feature selection: drop bottom 30% importance (RandomForest scout)
#   + Sample weights: class_weight × time_decay (exp half-life = 40% train len)
#   + Threshold search: maximize precision×√recall, min_precision_floor từ config
