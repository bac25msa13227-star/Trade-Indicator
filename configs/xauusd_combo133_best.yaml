# ─── COMBO #133 PARAMS (hardcoded trong show_combo133_daily.py) ──────────────
#   STARTING_BAL  = 200.0          # Vốn ban đầu mỗi fold (không compound)
#   TRAIN_BARS    = 30_000         # ~104 ngày dữ liệu train
#   TEST_BARS     = 6_000          # ~20 ngày test mỗi fold
#   STEP_BARS     = 6_000          # Bước nhảy = TEST_BARS
#   TEST_START    = "2024-01-01"   # Bắt đầu tính từ Jan 2024
#   MIN_CONF      = 0.70           # Ngưỡng xác suất vào lệnh
