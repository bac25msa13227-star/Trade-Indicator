global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── FastAPI app (exposes /metrics via prometheus_client) ──────────────────
  - job_name: "xauusd_api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # ── Live trading bots (running on Windows host — scrape via host.docker.internal) ──
  - job_name: "xauusd_live_acc1"
    static_configs:
      - targets: ["host.docker.internal:8001"]
    metrics_path: /metrics

  - job_name: "xauusd_live_acc2"
    static_configs:
      - targets: ["host.docker.internal:8002"]
    metrics_path: /metrics

  # ── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── PostgreSQL exporter (optional — add postgres_exporter container) ──────
  # - job_name: "postgres"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]
