# ─────────────────────────────────────────────────────────────────
# ICT + Wyckoff Enhanced Training Config
# Train: 2022-01-01 → 2025-12-31  |  Test: 2026-01-01 → 2026-03-09
# ─────────────────────────────────────────────────────────────────
app:
  model_path: outputs/model_ict_wyckoff.pkl
  scaler_path: outputs/scaler_ict_wyckoff.pkl
  model_meta_path: outputs/model_meta_ict_wyckoff.json
  training_report_path: outputs/training_report_ict_wyckoff.json
  training_plot_path: outputs/training_metrics_ict_wyckoff.png
  backtest_report_path: outputs/backtest_report_ict_wyckoff.json
  backtest_trades_path: outputs/backtest_trades_ict_wyckoff.csv
  backtest_equity_plot_path: outputs/backtest_equity_ict_wyckoff.png
  backtest_trades_plot_path: outputs/backtest_trades_plot_ict_wyckoff.png
  walkforward_report_path: outputs/walkforward_report_ict_wyckoff.json
  walkforward_trades_path: outputs/walkforward_trades_ict_wyckoff.csv
  paper_trade_log_path: outputs/paper_trade_signals.csv
  live_learning_log_path: outputs/live_learning_log.jsonl
  dashboard_host: 0.0.0.0
  dashboard_port: 8501
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: XAUUSD=X
  training_data_source: csv_folder
  live_data_source: mt5
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M15
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4      # ICT structure on H4
  execution_timeframe: M15
  bars:
    D1: 1500
    H1: 25000
    H4: 8000
    M15: 50000
  timezone: UTC

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20            # BOS/CHoCH lookback
  volatility_window: 20
  signal_threshold: 0.50
  sideways_volatility_threshold: 0.003
  strong_volatility_threshold: 0.010
  news_block_minutes: 0
  rsi_long_threshold: 52
  rsi_short_threshold: 48
  ict_weight: 0.40              # ICT tăng weight vì thêm nhiều ICT features
  wyckoff_weight: 0.35          # Wyckoff weight cao
  momentum_weight: 0.25
  min_strategy_score: 0.10
  sideway_min_strategy_score: 0.05
  strong_volatility_min_strategy_score: 0.10
  require_trend_alignment: false
  blocked_hours_utc: []
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc: {}

risk:
  mode: fixed_fractional
  risk_per_trade: 0.0065
  max_open_positions: 1
  stop_loss_atr_multiple: 1.8
  take_profit_rr: 2.2
  min_confidence: 0.45
  fixed_lot: 0.01
  max_risk_fraction: 0.011
  sideway_risk_multiplier: 0.3
  normal_risk_multiplier: 0.9
  strong_volatility_risk_multiplier: 0.55

execution:
  auto_trade: false
  deviation: 20
  magic_number: 20260309
  comment: xauusd-ai-ict-wyckoff

training:
  # ── DATE-BASED SPLIT ──────────────────────────────────────────
  train_start_date: "2022-01-01"
  train_end_date:   "2025-12-31"
  test_start_date:  "2026-01-01"
  test_end_date:    "2026-03-13"
  # ─────────────────────────────────────────────────────────────
  train_split: 0.80
  label_horizon: 6
  min_return_threshold: 0.0006
  retrain_on_startup: false
  live_learning_enabled: true
  live_learning_min_new_bars: 12
  live_learning_min_rows: 500
  save_dataset: true
  dataset_path: outputs/training_dataset_ict_wyckoff.csv
  optimize_threshold: true
  validation_split: 0.15
  threshold_min: 0.45
  threshold_max: 0.80
  threshold_step: 0.01
  min_precision_floor: 0.52

notifications:
  telegram_enabled: false

integrations:
  mt5:
    enabled: false
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  news:
    enabled: false
    provider: stub
