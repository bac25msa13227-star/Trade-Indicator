# ─────────────────────────────────────────────────────────────────
# ICT + Wyckoff Enhanced Training Config
# Train: Dec 2021 → Dec 2024 (3 năm)  |  Test: Jan 2025 → Mar 2026 (15 tháng)
# ─────────────────────────────────────────────────────────────────
app:
  poll_seconds: 300                   # Check mỗi 5 phút (M15 candle)
  model_path: outputs/model_ict_wyckoff.pkl
  scaler_path: outputs/scaler_ict_wyckoff.pkl
  model_meta_path: outputs/model_meta_ict_wyckoff.json
  training_report_path: outputs/training_report_ict_wyckoff.json
  training_plot_path: outputs/training_metrics_ict_wyckoff.png
  backtest_report_path: outputs/backtest_report_acc1.json
  backtest_trades_path: outputs/backtest_trades_acc1.csv
  backtest_equity_plot_path: outputs/backtest_equity_acc1.png
  backtest_trades_plot_path: outputs/backtest_trades_plot_acc1.png
  walkforward_report_path: outputs/walkforward_report_ict_wyckoff.json
  walkforward_trades_path: outputs/walkforward_trades_ict_wyckoff.csv
  paper_trade_log_path: outputs/paper_trade_signals.csv
  live_learning_log_path: outputs/live_learning_log.jsonl
  live_closed_trades_path: outputs/live_closed_trades_acc1.csv
  dashboard_host: 0.0.0.0
  dashboard_port: 8501
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: XAUUSD=X
  training_data_source: csv_folder
  live_data_source: mt5
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M15
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4      # ICT structure on H4
  execution_timeframe: M15
  bars:
    D1: 1500
    H1: 25000
    H4: 8000
    M15: 50000
  timezone: UTC

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20            # BOS/CHoCH lookback
  volatility_window: 20
  signal_threshold: 0.60             # Tối ưu cho thị trường volatile cao
  sideways_volatility_threshold: 0.003
  strong_volatility_threshold: 0.012  # Tăng lên 0.012 — phù hợp ATR/price hiện tại ~0.0125
  news_block_minutes: 0
  rsi_long_threshold: 52
  rsi_short_threshold: 48
  ict_weight: 0.40
  wyckoff_weight: 0.35
  momentum_weight: 0.25
  min_strategy_score: 0.05           # Giảm xuống 0.05 — để model confidence là cổng chính
  sideway_min_strategy_score: 0.05
  strong_volatility_min_strategy_score: 0.08  # Giảm — bull run cần ít xác nhận hơn
  require_trend_alignment: false     # Tắt — model tự quyết định hướng
  blocked_hours_utc: [22, 23]        # Chỉ block rollover — không block London/NY
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc:
    Friday: [20, 21, 22, 23]          # Block cuối tuần spread cao
  # Silver Bullet ICT windows — tăng độ chính xác
  silver_bullet_enabled: true
  silver_bullet_windows_utc: [[3, 4], [10, 11], [14, 15]]
  silver_bullet_confidence_boost: 0.03
  # ADX gate — chỉ trade khi có xu hướng rõ
  adx_gate_enabled: true
  adx_min_trend: 15.0                # Thấp hơn vì thị trường luôn trending mạnh
  # Regime-specific confidence
  sideway_min_confidence: 0.62
  volatile_min_confidence: 0.56      # Thấp hơn — bull run dễ dự đoán hướng

risk:
  mode: fixed_fractional
  risk_per_trade: 0.04              # 4% risk/lệnh — an toàn hơn, bền vững hơn
  risk_tier_floor: 0.02             # 2% floor khi drawdown >= 10%
  max_open_positions: 3
  # ── Normal regime (default) ──
  stop_loss_atr_multiple: 1.5
  take_profit_rr: 3.0               # RR 1:3 normal
  min_confidence: 0.60
  fixed_lot: 0.01
  max_risk_fraction: 0.06           # Giảm từ 8% xuống 6%
  # ── Sideways regime: SL chặt hơn, TP gần hơn ──
  sideway_sl_atr_multiple: 1.0      # SL hẹp trong sideways
  sideway_take_profit_rr: 2.0       # TP gần — ít room hơn
  # ── Volatile regime: SL rộng hơn, TP xa hơn — bull run XAUUSD 2026 ──
  volatile_sl_atr_multiple: 2.0     # SL vừa phải — giảm từ 2.5 tránh over-exposure
  volatile_take_profit_rr: 4.0      # TP xa — bắt trend mạnh
  sideway_risk_multiplier: 0.5
  normal_risk_multiplier: 1.0
  strong_volatility_risk_multiplier: 0.7   # Giảm risk trong regime volatile cao
  # Circuit breaker & Capital Preservation
  daily_loss_limit_pct: 0.06        # 6% max daily loss → dừng giao dịch ngày hôm đó
  max_drawdown_kill_pct: 0.15       # 15% drawdown tổng → dừng toàn bộ
  consecutive_loss_pause_count: 3    # Sau 3 lệnh thua liên tiếp...
  consecutive_loss_cooldown_bars: 8  # ...chờ 8 bars (2h M15) trước khi tiếp tục
  anti_martingale_factor: 0.6        # Risk × 0.6 mỗi lệnh thua liên tiếp
  anti_martingale_max_reductions: 3  # Tối đa 3 lần giảm (xuống ~21% base risk)
  max_total_exposure_pct: 0.09       # 9% tổng risk tối đa tất cả lệnh mở
  # Partial Take Profit — chốt 50% tại 1R để bảo toàn lợi nhuận
  partial_tp_enabled: true
  partial_tp_rr: 1.0                # Chốt 50% tại 1R profit
  partial_tp_pct: 0.5               # Chốt 50% position

execution:
  auto_trade: true                    # ← BẬT GIAO DỊCH THẬT
  deviation: 20
  magic_number: 20260309
  comment: xauusd-ai-ict-wyckoff

  trailing_sl:
    enabled: true                     # Bật Trailing SL
    breakeven_at_rr: 0.5              # Chuyển SL về hoà vốn sau 0.5R
    activation_rr: 1.0               # Bắt đầu trail sau 1R lời
    trail_atr_multiple: 1.0          # Trail cách 1 × ATR

  dca:
    enabled: false                    # TẮT DCA — an toàn hơn
    max_dca_count: 2
    trigger_atr_multiple: 1.5
    lot_multiplier: 1.5
    max_total_risk_pct: 0.03

  exit_model:
    enabled: false
    exit_model_path: "outputs/exit_model.pkl"
    exit_scaler_path: "outputs/exit_scaler.pkl"
    exit_model_meta_path: "outputs/exit_model_meta.json"
    exit_threshold: 0.60
    min_unrealized_rr: 0.30
    exit_min_hold_bars: 2
    also_cut_losses: false
    min_loss_rr: -0.50

training:
  retrain_on_startup: false          # Đã có model, không cần retrain khi restart
  # ── DATE-BASED SPLIT: train 2023-2026/03/08, test 09/03/2026 → nay ──────────
  train_start_date: "2023-01-01"   # 3 năm gần nhất — bao gồm toàn bộ bull run 2025
  train_end_date:   "2026-03-08"   # Train đến ngày trước test (thay vì chỉ đến 2024)
  test_start_date:  "2026-03-09"   # Test: gold bull run ATR ~50, từ 3200→4375
  test_end_date:    null           # Đến cuối data (23/03/2026)
  # ─────────────────────────────────────────────────────────────────────
  train_split: 0.70                  # bị bỏ qua khi dùng date split
  label_horizon: 24                  # 24 × M15 = 6 giờ — xa hơn cho volatile bull run
  sltp_label_max_horizon: 40         # Cho nhiều bars hơn để TP/SL reach
  label_tp_rr: 2.5                   # Label dùng RR 2.5 (dễ đạt hơn 3.0 trong volatile)
  min_return_threshold: 0.0010       # Nhãn win ≥0.10% — tăng positive rate
  live_learning_enabled: true
  live_learning_min_new_bars: 12
  live_learning_min_rows: 500
  save_dataset: true
  dataset_path: outputs/training_dataset_ict_wyckoff.csv
  optimize_threshold: true
  validation_split: 0.15
  threshold_min: 0.45                # Không thấp quá — tránh overfit noise
  threshold_max: 0.80
  threshold_step: 0.01
  min_precision_floor: 0.48          # Precision 48%+ với RR 2.5 → EV dương
  backtest_initial_balance: 200.0    # vốn khởi đầu 200 USD
  backtest_max_balance_multiplier: 200.0  # cap 200× = $40k

notifications:
  telegram_enabled: true
  verbose_message: true

integrations:
  mt5:
    enabled: true                     # ← BẬT kết nối MT5
    login_env: MT5_LOGIN
    password_env: MT5_PASSWORD
    server_env: MT5_SERVER
    terminal_path: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
  telegram:
    token_env: TELEGRAM_BOT_TOKEN_ACC1
    chat_id_env: TELEGRAM_CHAT_ID_ACC1
  news:
    enabled: false
    provider: stub
