# ACC2 M1 Scalp Config — deploy lock (setup-exit H10, 2026-04-10)
# ─────────────────────────────────────────────────────────────────
# Locked values (best guarded profile in current code path):
#   - threshold: 0.61
#   - risk_per_trade: 0.022
#   - daily_loss_limit_pct: 0.12
#   - max_open_positions: 2
#   - sideway_risk_multiplier: 0.70
#   - strong_volatility_risk_multiplier: 1.20
#   - cooldown_bars: 6
#   - setup_exit_enabled: true
#   - setup_exit_scale: 0.75
#   - setup_label_mode: setup_aware
#   - sltp_label_max_horizon / label_horizon: 10
#   - dynamic_sltp_label_enabled: false (runtime dynamic SL/TP only)
# ─────────────────────────────────────────────────────────────────

app:
  poll_seconds: 60                            # 1-minute poll = 1 M1 bar resolution
  model_path: outputs/acc2_scalp_m1_h10_setup_exit_model.pkl
  scaler_path: outputs/acc2_scalp_m1_h10_setup_exit_scaler.pkl
  model_meta_path: outputs/acc2_scalp_m1_h10_setup_exit_model_meta.json
  walkforward_report_path: outputs/acc2_scalp_m1_walkforward_report.json
  walkforward_trades_path: outputs/acc2_scalp_m1_walkforward_trades.csv
  paper_trade_log_path: outputs/paper_trade_signals_acc2_scalp_m1.csv
  live_learning_log_path: outputs/live_learning_log_acc2_scalp_m1.jsonl
  live_closed_trades_path: outputs/live_closed_trades_acc2_scalp_m1.csv
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: GC=F
  training_data_source: csv
  csv_data_path: src/xauusd_ai/real_data/XAUUSDm_M1.csv    # M1 primary
  live_data_source: bridge
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M1                                         # execution timeframe
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4
  execution_timeframe: M1                                   # ← M1 native
  bars:
    D1: 100
    H1: 500
    H4: 200
    M30: 300
    M15: 300
    M5: 500                                                 # M5 context bars
    M1: 1000                                                # ↑ need more M1 warmup
  timezone: UTC
  enforce_market_open_gate: true
  market_tick_stale_seconds: 120                            # ↓ M1: stale after 2 min
  market_preopen_alert_minutes: 30
  market_preclose_alert_minutes: 30
  market_preopen_alert_minutes_list: [1440, 30]
  market_preclose_alert_minutes_list: [1440, 30]

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20
  volatility_window: 20

  # ── M1 scalp: probability threshold gate (WF best: thr=0.60 for normal regime) ───
  signal_threshold: 0.60
  sideways_volatility_threshold: 0.003
  strong_volatility_threshold: 0.016
  news_block_minutes: 0                     # news filter handled by integrations.news

  rsi_long_threshold: 50
  rsi_short_threshold: 50
  ict_weight: 0.25
  wyckoff_weight: 0.15
  momentum_weight: 0.30
  min_strategy_score: 0.00
  sideway_min_strategy_score: 0.00
  strong_volatility_min_strategy_score: 0.00
  require_trend_alignment: false
  force_trade: false

  # ── Trading hours: all sessions ────────────────────────────────────────────
  # No hour restriction — live/WF parity requires both to trade all hours
  # Former value Mon-Fri [7-11,13-17] cut ~58% of trades vs pre-patch behavior
  blocked_hours_utc: []
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc: {}
  allowed_weekday_hours_utc: {}

  # ── ICT Silver Bullet windows ────────────────────────────────────────────
  silver_bullet_enabled: true
  silver_bullet_windows_utc: [[3, 4], [6, 7], [10, 11], [14, 15]]
  silver_bullet_confidence_boost: 0.03
  scalp_quality_adjustment_enabled: false   # disabled: WF does not apply quality adjustment at inference
  scalp_quality_adjustment_weight: 0.02
  scalp_quality_adjustment_max_delta: 0.06

  # ── ADX gate: DISABLED — M1 micro-moves work in all trend conditions ──────
  adx_gate_enabled: false
  adx_min_trend: 15.0
  sideway_min_confidence: 0.60
  volatile_min_confidence: 0.60

  regime_shutdown_rules: []

risk:
  mode: fixed_fractional

  # ── Sizing: locked realistic WF profile ────────────────────────────────────
  risk_per_trade: 0.0220                    # 2.2% per trade (setup-exit H10 lock)
  risk_tier_floor: 0.002                    # floor at 0.2%
  max_open_positions: 2                     # reduce concurrent exposure
  max_risk_fraction: 0.054                  # ~= 1.8x risk_per_trade
  max_total_exposure_pct: 0.060             # align with WF eval profile

  # ── SL/TP (safe patch: avoid too-short SL on volatile M1 bursts) ─────────
  stop_loss_atr_multiple: 1.1
  min_stop_loss_points: 2.0
  min_stop_loss_atr_multiple: 1.2
  sl_volatility_boost_enabled: true
  sl_volatility_boost_trigger_percentile: 0.85
  sl_volatility_boost_max_multiplier: 1.8
  take_profit_rr: 1.8
  sideway_take_profit_rr: 1.6
  volatile_take_profit_rr: 2.0

  # ── Hybrid dynamic SL/TP (model-driven + safety rails) ───────────────────
  dynamic_sltp_enabled: true
  dynamic_sltp_backtest_enabled: true
  dynamic_sltp_confidence_weight: 0.70
  dynamic_sltp_quality_weight: 0.30
  dynamic_sltp_sl_scale: 0.25
  dynamic_sltp_tp_scale: 0.45
  dynamic_sltp_sl_mult_min: 0.90
  dynamic_sltp_sl_mult_max: 1.60
  dynamic_sltp_tp_rr_min: 1.20
  dynamic_sltp_tp_rr_max: 2.80
  dynamic_sltp_debug_in_reason: true
  setup_exit_enabled: true
  setup_exit_scale: 0.75

  # ── Confidence gate ────────────────────────────────────────────────────────
  min_confidence: 0.60

  fixed_lot: 0.01
  sideway_risk_multiplier: 1.0
  normal_risk_multiplier: 1.0
  strong_volatility_risk_multiplier: 1.2

  spread_cost_rr: 0.035                    # Exness Pro XAUUSD ~$0.15 spread / $4.38 1R
  slippage_rr: 0.01
  commission_rr: 0.0                        # Exness Pro: no commission (spread-only)

  # ── Kill switch ────────────────────────────────────────────────────────────
  kill_switch_enabled: true
  daily_loss_limit_pct: 0.12               # 12% daily cap (WF lock)
  max_drawdown_kill_pct: 0.12              # kill at 12% DD (WF max was 9.5% at 0.3%)

  # ── Loss management ───────────────────────────────────────────────────────
  # M1: re-enter fast — market moves every minute
  consecutive_loss_pause_count: 2
  consecutive_loss_cooldown_bars: 4
  anti_martingale_factor: 0.2              # minimal size reduction after loss streak
  anti_martingale_max_reductions: 2

  # ── Re-entry guard ────────────────────────────────────────────────────────
  reentry_guard_enabled: true
  reentry_cooldown_bars_after_sl: 5        # hold longer after SL
  reentry_min_distance_atr: 0.45           # require more distance before same-side re-entry

  # ── Partial TP: take 50% at 1.0R, let rest run to 1.5R ───────────────────
  partial_tp_enabled: false
  partial_tp_rr: 1.0                      # take partial at 1R
  partial_tp_pct: 0.50                    # close 50% of position

  # ── Compound cap: 10x per fold ────────────────────────────────────────────
  # At 0.3% risk, compounding is slow — 10x enough without overflow
  compound_cap: 10.0

  risk_throttle_rules: []

execution:
  auto_trade: true
  deviation: 20
  magic_number: 20260408
  comment: xauusd-ai-acc2-scalp-m1-locked-20260409

  paper_trade_max_loops: 0
  paper_data_source: bridge

  # ── Direction flip: close opposite when model reverses ───────────────────
  close_opposite_on_signal: false

  # ── Trailing SL: tight trail for M1 scalp ────────────────────────────────
  trailing_sl:
    enabled: false
    breakeven_at_rr: 0.5                  # move to BE at 0.5R
    activation_rr: 0.8                    # start trailing at 0.8R
    trail_atr_multiple: 0.5               # tight trail (M1 ATR-scaled)

training:
  # ── Data split aligned with current optimization window ───────────────────
  train_start_date: "2026-02-01"
  train_end_date: "2026-03-20"
  test_start_date: "2026-03-22"
  test_end_date: "2026-03-30"
  dataset_start_date: "2023-01-01"

  train_split: 0.80
  use_sltp_label: true

  # ── SCALP LABEL: SL/TP race within short M1 horizon ───────────────────────
  sltp_label_max_horizon: 10              # 10 M1 bars horizon for setup-exit profile
  setup_label_mode: setup_aware
  dynamic_sltp_label_enabled: false       # keep static labels; dynamic SL/TP handled at runtime
  label_tp_rr: 1.5                        # TP at 1.5R (SL at 0.8×ATR → TP at 1.2×ATR)
  label_horizon: 10
  min_return_threshold: 0.0006
  retrain_on_startup: false               # model loaded from pkl (DualScalpM1 — do NOT retrain via standard ModelTrainer)
  live_learning_enabled: false
  optimize_threshold: false
  save_dataset: true
  dataset_path: outputs/acc2_scalp_m1_training_dataset.csv

  # ── WF windows (M1 bars): aligned with backtest ───────────────────────────
  walkforward_train_size: 250000          # ~6 months of M1 bars (~250K bars)
  walkforward_test_size: 50000            # ~8 weeks test window
  walkforward_step_size: 50000            # step 8 weeks
  walkforward_max_combinations: 30
  walkforward_max_folds_per_combination: 18
  backtest_initial_balance: 200.0

notifications:
  telegram_enabled: true
  verbose_message: true

integrations:
  mt5:
    enabled: true
    login_env: MT5_LOGIN
    password_env: MT5_PASSWORD
    server_env: MT5_SERVER
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  news:
    enabled: true
    provider: forexfactory
    minutes_before: 2
    minutes_after: 5
    trade_before_news: false
    trade_after_news: true
    high_impact_only: true
    currencies: [USD]
    news_trade_override: false
