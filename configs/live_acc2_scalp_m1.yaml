# ACC2 M1 Scalp Config — native M1 architecture, 0.3% fixed risk
# ─────────────────────────────────────────────────────────────────
# WF RESULTS (18 folds, Sep 2023 → Mar 2026):
#   ▶ 18/18 folds positive | WR 52-56% | PF 1.71-2.12
#   ▶ ATH gold period (Aug 2023-Jul 2024): 7/7 folds positive (M5 model = 0% WR on same)
#   ▶ Non-compound edge: +12,015%/yr  |  Max non-compound fold: +14,749%
#   ▶ MaxDD @ 0.3%: 9.5%  (vs 28.4% @ 1.0%,  18.7% @ 0.5%)
#   ▶ Trades/fold (~8 weeks): ~4,700  ≈ 120 trades/day
#
# KEY differences vs live_acc2_scalp.yaml (M5-native):
#   execution_timeframe: M1  (was M5)
#   risk_per_trade: 0.003    (0.3% — was 0.15%)
#   label_horizon: 8         (8 M1 bars = 8 min — was 24)
#   label_tp_rr: 1.5         (was 1.0)
#   adx_gate_enabled: false  (disabled — M1 edge does not need ADX filter)
#   stop_loss_atr_multiple: 0.8
#   take_profit_rr: 1.5
#   signal_threshold: 0.58 / sell_threshold: 0.55  (dual model, see thresholds)
#   walkforward_train_size: 250000  (~6 months M1 bars)
#   walkforward_test_size: 50000    (~8 weeks)
#
# ─────────────────────────────────────────────────────────────────

app:
  poll_seconds: 60                            # 1-minute poll = 1 M1 bar resolution
  model_path: outputs/acc2_scalp_m1_model.pkl
  scaler_path: outputs/acc2_scalp_m1_scaler.pkl
  model_meta_path: outputs/acc2_scalp_m1_model_meta.json
  walkforward_report_path: outputs/acc2_scalp_m1_walkforward_report.json
  walkforward_trades_path: outputs/acc2_scalp_m1_walkforward_trades.csv
  paper_trade_log_path: outputs/paper_trade_signals_acc2_scalp_m1.csv
  live_learning_log_path: outputs/live_learning_log_acc2_scalp_m1.jsonl
  live_closed_trades_path: outputs/live_closed_trades_acc2_scalp_m1.csv
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: GC=F
  training_data_source: csv
  csv_data_path: src/xauusd_ai/real_data/XAUUSDm_M1.csv    # M1 primary
  live_data_source: yfinance
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M1                                         # execution timeframe
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4
  execution_timeframe: M1                                   # ← M1 native
  bars:
    D1: 100
    H1: 500
    H4: 200
    M30: 300
    M15: 300
    M5: 500                                                 # M5 context bars
    M1: 1000                                                # ↑ need more M1 warmup
  timezone: UTC
  enforce_market_open_gate: true
  market_tick_stale_seconds: 120                            # ↓ M1: stale after 2 min
  market_preopen_alert_minutes: 30
  market_preclose_alert_minutes: 30
  market_preopen_alert_minutes_list: [1440, 30]
  market_preclose_alert_minutes_list: [1440, 30]

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20
  volatility_window: 20

  # ── M1 scalp: probability threshold gates (aligned with WF training) ───────
  # BUY model threshold: 0.58  |  SELL model threshold: 0.55
  # signal_threshold is the minimum probability; bot uses dual-model inference
  signal_threshold: 0.55                    # SELL is the lower gate
  sideways_volatility_threshold: 0.003
  strong_volatility_threshold: 0.016
  news_block_minutes: 0                     # news filter handled by integrations.news

  rsi_long_threshold: 50
  rsi_short_threshold: 50
  ict_weight: 0.40
  wyckoff_weight: 0.35
  momentum_weight: 0.25
  min_strategy_score: 0.0                   # disabled — dual model gates standalone
  sideway_min_strategy_score: 0.0
  strong_volatility_min_strategy_score: 0.0
  require_trend_alignment: false
  force_trade: false

  # ── Trading hours: all liquid sessions ────────────────────────────────────
  # M1 scalp works in all sessions — ATH folds confirm regime-agnostic edge
  # Exclude: Asian low-vol dead zone (04-05 UTC) and weekend gaps
  blocked_hours_utc: []
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc: {}
  allowed_weekday_hours_utc:
    Monday:    [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 20, 21, 22]
    Tuesday:   [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 20, 21, 22]
    Wednesday: [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 20, 21, 22]
    Thursday:  [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 20, 21, 22]
    Friday:    [0, 1, 2, 3, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17]

  # ── ICT Silver Bullet windows ────────────────────────────────────────────
  silver_bullet_enabled: true
  silver_bullet_windows_utc: [[3, 4], [6, 7], [10, 11], [14, 15]]
  silver_bullet_confidence_boost: 0.03

  # ── ADX gate: DISABLED — M1 micro-moves work in all trend conditions ──────
  adx_gate_enabled: false
  adx_min_trend: 15.0
  sideway_min_confidence: 0.55
  volatile_min_confidence: 0.55

  regime_shutdown_rules: []

risk:
  mode: fixed_fractional

  # ── Sizing: 0.3% per trade ────────────────────────────────────────────────
  # WF MaxDD @ 0.3%: 9.5%  |  @ 0.5%: 18.7%  |  @ 1.0%: 28.4%
  # 120 trades/day × 0.3% exposure = low concentration risk
  risk_per_trade: 0.003                     # 0.3% per trade (conservative)
  risk_tier_floor: 0.002                    # floor at 0.2%
  max_open_positions: 2                     # max 2 concurrent M1 scalp positions
  max_risk_fraction: 0.006                  # max 0.6% at any instant
  max_total_exposure_pct: 0.006             # total account exposure cap

  # ── SL/TP (aligned with WF labels: SL=0.8×ATR, TP=1.5R) ─────────────────
  stop_loss_atr_multiple: 0.8               # tight SL = better R:R for scalping
  take_profit_rr: 1.5                       # aligned with label_tp_rr
  sideway_take_profit_rr: 1.5
  volatile_take_profit_rr: 1.5             # keep TP fixed — model trained for 1.5R

  # ── Confidence gate ────────────────────────────────────────────────────────
  min_confidence: 0.55                      # aligned with SELL threshold (lower gate)

  fixed_lot: 0.01
  sideway_risk_multiplier: 1.0              # scalp works in sideways — keep full size
  normal_risk_multiplier: 1.0
  strong_volatility_risk_multiplier: 1.0   # don't increase size in volatile — ATR adapts

  spread_cost_rr: 0.01
  slippage_rr: 0.01
  commission_rr: 0.0

  # ── Kill switch ────────────────────────────────────────────────────────────
  kill_switch_enabled: true
  daily_loss_limit_pct: 0.008              # 0.8% daily loss limit (≈ 3 losing trades at 0.3%)
  max_drawdown_kill_pct: 0.12              # kill at 12% DD (WF max was 9.5% at 0.3%)

  # ── Loss management ───────────────────────────────────────────────────────
  # M1: re-enter fast — market moves every minute
  consecutive_loss_pause_count: 3          # pause after 3 consecutive losses
  consecutive_loss_cooldown_bars: 8        # 8 M1 bars = 8 minute cooldown
  anti_martingale_factor: 0.2              # minimal size reduction after loss streak
  anti_martingale_max_reductions: 2

  # ── Re-entry guard ────────────────────────────────────────────────────────
  reentry_guard_enabled: true
  reentry_cooldown_bars_after_sl: 2        # 2 M1 bars after SL hit
  reentry_min_distance_atr: 0.15          # allow re-entry at similar level (M1 micro-moves)

  # ── Partial TP: take 50% at 1.0R, let rest run to 1.5R ───────────────────
  partial_tp_enabled: true
  partial_tp_rr: 1.0                      # take partial at 1R
  partial_tp_pct: 0.50                    # close 50% of position

  # ── Compound cap: 10x per fold ────────────────────────────────────────────
  # At 0.3% risk, compounding is slow — 10x enough without overflow
  compound_cap: 10.0

  risk_throttle_rules: []

execution:
  auto_trade: true
  deviation: 20
  magic_number: 20260408
  comment: xauusd-ai-acc2-scalp-m1-v1

  paper_trade_max_loops: 0
  paper_data_source: yfinance

  # ── Direction flip: close opposite when model reverses ───────────────────
  close_opposite_on_signal: true

  # ── Trailing SL: tight trail for M1 scalp ────────────────────────────────
  trailing_sl:
    enabled: true
    breakeven_at_rr: 0.5                  # move to BE at 0.5R
    activation_rr: 0.8                    # start trailing at 0.8R
    trail_atr_multiple: 0.5               # tight trail (M1 ATR-scaled)

training:
  # ── Data: 2019-01-01 covers full M1 dataset including ATH period ──────────
  train_start_date: "2019-01-01"
  train_end_date: "2026-04-01"
  test_start_date: "2026-04-02"
  test_end_date: null

  train_split: 0.80
  use_sltp_label: true

  # ── SCALP LABEL: SL/TP race within 8 M1 bars (8 minutes) ─────────────────
  sltp_label_max_horizon: 8               # ← 8 M1 bars (was 24/96 in M5 configs)
  label_tp_rr: 1.5                        # TP at 1.5R (SL at 0.8×ATR → TP at 1.2×ATR)
  label_horizon: 8                        # prevents slot congestion in simulation engine
  min_return_threshold: 0.0005            # ↓ M1 moves are smaller
  retrain_on_startup: false               # model loaded from pkl (DualScalpM1 — do NOT retrain via standard ModelTrainer)
  live_learning_enabled: false
  optimize_threshold: false
  save_dataset: true
  dataset_path: outputs/acc2_scalp_m1_training_dataset.csv

  # ── WF windows (M1 bars): aligned with backtest ───────────────────────────
  walkforward_train_size: 250000          # ~6 months of M1 bars (~250K bars)
  walkforward_test_size: 50000            # ~8 weeks test window
  walkforward_step_size: 50000            # step 8 weeks
  walkforward_max_combinations: 30
  walkforward_max_folds_per_combination: 18
  backtest_initial_balance: 200.0

notifications:
  telegram_enabled: true
  verbose_message: true

integrations:
  mt5:
    enabled: true
    login_env: MT5_LOGIN
    password_env: MT5_PASSWORD
    server_env: MT5_SERVER
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  news:
    enabled: true
    provider: forexfactory
    minutes_before: 2
    minutes_after: 5
    trade_before_news: false
    trade_after_news: true
    high_impact_only: true
    currencies: [USD]
    news_trade_override: false
