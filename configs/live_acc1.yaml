# ─────────────────────────────────────────────────────────────────
# LIVE TRADING CONFIG — Account 1 (ACC1 freeze profile)
# Model:  outputs/acc1_live_model.pkl  (frozen snapshot from acc2 live-freeze)
# Symbol: XAUUSDm  |  Threshold: 0.60  |  Risk: 5% dynamic
# Target: frozen paper/deploy profile with stricter gate than the previous 0.50 setup
# ─────────────────────────────────────────────────────────────────
app:
  poll_seconds: 60
  model_path:          outputs/acc1_live_model.pkl
  scaler_path:         outputs/acc1_live_scaler.pkl
  model_meta_path:     outputs/acc1_live_model_meta.json
  training_report_path: outputs/training_report_acc1.json
  training_plot_path:  outputs/training_metrics_acc1.png
  backtest_report_path: outputs/backtest_report_acc1.json
  backtest_trades_path: outputs/backtest_trades_acc1.csv
  backtest_equity_plot_path: outputs/backtest_equity_acc1.png
  backtest_trades_plot_path: outputs/backtest_trades_plot_acc1.png
  walkforward_report_path: outputs/walkforward_report_acc1.json
  walkforward_trades_path: outputs/walkforward_trades_acc1.csv
  paper_trade_log_path: outputs/paper_trade_signals_acc1.csv
  live_learning_log_path: outputs/live_learning_log_acc1.jsonl
  live_closed_trades_path: outputs/live_closed_trades_acc1.csv
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: GC=F
  training_data_source: csv_folder
  live_data_source: yfinance
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M15
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4
  execution_timeframe: M5
  bars:
    D1: 100
    H1: 500
    H4: 200
    M15: 300
    M5: 500
    M1: 200
  timezone: UTC

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20
  volatility_window: 20
  signal_threshold: 0.60             # Freeze threshold requested for acc1
  sideways_volatility_threshold: 0.003
  strong_volatility_threshold: 0.016
  news_block_minutes: 0              # Tắt blackout ML feature (dùng news override thay thế)
  rsi_long_threshold: 50             # Less strict than acc2 (52)
  rsi_short_threshold: 50            # Less strict than acc2 (48)
  ict_weight: 0.40
  wyckoff_weight: 0.35
  momentum_weight: 0.25
  min_strategy_score: 0.05           # Lower → allow more setups through
  sideway_min_strategy_score: 0.08   # Lower than acc2 (0.15) → trade more in ranging
  strong_volatility_min_strategy_score: 0.08
  require_trend_alignment: false
  force_trade: false
  blocked_hours_utc: [15, 22, 23]    # Block rollover + validated weak hour cluster
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc:
    Monday: [4, 5, 16, 17, 18, 19, 20, 21]
    Tuesday: [3, 17, 18]
    Thursday: [5, 13]
  regime_shutdown_rules:
    - name: monday_early_sell_flow_conflict
      weekdays_utc: [Monday]
      hours_utc: [1, 2]
      sides: [sell]
      volatility_regimes: [1]
      trend_alignment_values: [0]
      trend_strength_max: -0.24
      execution_quality_min: 0.0
    - name: thursday_pm_sell_flow_conflict
      weekdays_utc: [Thursday]
      hours_utc: [16, 17, 18]
      sides: [sell]
      volatility_regimes: [1]
      execution_quality_min: 0.0
    - name: wed_thu_early_buy_trap
      weekdays_utc: [Wednesday, Thursday]
      hours_utc: [3, 4, 5]
      sides: [buy]
      trend_strength_max: -0.4
      execution_quality_max: 0.3
  # Silver Bullet ICT windows
  silver_bullet_enabled: true
  silver_bullet_windows_utc: [[3, 4], [10, 11], [14, 15]]
  silver_bullet_confidence_boost: 0.05  # Slightly higher boost than acc2 (0.03)
  # ADX trend gate — relaxed so we enter more often
  adx_gate_enabled: true
  adx_min_trend: 15.0               # More relaxed than acc2 (18.0)
  # Regime-specific confidence thresholds — all lower than acc2
  sideway_min_confidence: 0.60       # Freeze acc1 at a single 0.60 gate across regimes
  volatile_min_confidence: 0.60

risk:
  mode: fixed_fractional
  risk_per_trade: 0.05              # 5% per trade (acc2=3%) → bigger wins per trade
  risk_tier_floor: 0.025            # 2.5% floor when in drawdown
  max_open_positions: 3
  stop_loss_atr_multiple: 1.5
  take_profit_rr: 3.5
  volatile_take_profit_rr: 5.0     # ACC2 logic: Volatile regime RR 1:5
  sideway_take_profit_rr: 2.5      # Sideways regime RR 1:2.5
  min_confidence: 0.60             # Freeze threshold requested for acc1
  fixed_lot: 0.01
  max_risk_fraction: 0.05           # 5% cap per trade (same as acc2)
  sideway_risk_multiplier: 0.4      # ACC2 logic: giảm risk trong sideway
  normal_risk_multiplier: 1.0
  strong_volatility_risk_multiplier: 0.65  # ACC2 logic
  # Circuit breaker — copied from acc2
  daily_loss_limit_pct: 0.0
  max_drawdown_kill_pct: 0.15       # ACC2 logic: 15% drawdown → full stop
  consecutive_loss_pause_count: 0  # Disabled    # ACC2 logic: 3 losses before pause
  consecutive_loss_cooldown_bars: 8  # ACC2 logic: wait 8 bars before resuming
  anti_martingale_factor: 0.6        # ACC2 logic: Risk × 0.6 per consecutive loss
  anti_martingale_max_reductions: 3
  max_total_exposure_pct: 0.09       # ACC2 logic: 9% max total exposure
  # Partial Take Profit — book at 1.5R (better quality exits than 1.0R)
  partial_tp_enabled: true
  partial_tp_rr: 1.5                # Close 50% at 1.5R profit
  partial_tp_pct: 0.5               # Close 50% of position

execution:
  auto_trade: true
  deviation: 20
  magic_number: 20260325            # Unique for acc1
  comment: xauusd-ai-live-acc1-freeze
  paper_trade_max_loops: 0          # 0 = run continuously until manually stopped
  paper_data_source: yfinance       # Paper test should follow live feed, not static CSV
  close_opposite_on_signal: true

  trailing_sl:
    enabled: true
    breakeven_at_rr: 0.5
    activation_rr: 1.0
    trail_atr_multiple: 1.0

  dca:
    enabled: false
    max_dca_count: 2
    trigger_atr_multiple: 1.5
    lot_multiplier: 1.5
    max_total_risk_pct: 0.03

  exit_model:
    enabled: false
    exit_model_path: "outputs/exit_model_acc1.pkl"
    exit_scaler_path: "outputs/exit_scaler_acc1.pkl"
    exit_model_meta_path: "outputs/exit_model_meta_acc1.json"
    exit_threshold: 0.65
    min_unrealized_rr: 0.80
    exit_min_hold_bars: 4
    exit_label_horizon: 8
    exit_label_threshold_rr: 0.50
    max_entry_samples: 8000
    also_cut_losses: false
    min_loss_rr: -0.50


training:
  # ── DATE-BASED SPLIT — wider range for more diverse training ────────────────
  train_start_date: "2022-01-01"    # ACC1: start from 2022 for more data (~4yr)
  train_end_date:   "2026-03-08"
  test_start_date:  "2026-03-09"
  test_end_date:    null
  train_split: 0.70
  use_sltp_label: true
  sltp_label_max_horizon: 96         # 8h horizon (tighter than acc2's 192) → faster hits
  label_tp_rr: 1.5                   # ACC1: lower RR label → more positive samples
  label_horizon: 24                  # 2h horizon for signal validity
  min_return_threshold: 0.0008       # Lower → even more positive labels
  retrain_on_startup: false          # Dùng model freeze hiện tại ngay khi bot khởi động
  live_learning_enabled: true        # Bật tự học sau startup
  live_learning_interval_minutes: 60
  live_learning_min_new_bars: 12
  live_learning_min_rows: 500
  min_self_learning_roc_auc: 0.53
  optimize_threshold: false          # Giữ threshold 0.60 cố định cho acc1 live

notifications:
  telegram_enabled: true
  verbose_message: true

integrations:
  mt5:
    enabled: true
    login_env: MT5_LOGIN
    password_env: MT5_PASSWORD
    server_env: MT5_SERVER
    login: 270832477
    password: "07032001bB@"
    server: "Exness-MT5Trial17"
    terminal_path: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  news:
    enabled: true
    provider: forexfactory
    minutes_before: 2         # Chặn 2 phút trước tin (tránh spread rộng lúc chờ)
    minutes_after: 5          # Cửa sổ tín hiệu sau tin
    trade_before_news: false
    trade_after_news: true    # Cho phép lệnh sau tin qua filter bình thường
    high_impact_only: true
    currencies:
      - USD
    # --- News Trade Override: ép BUY/SELL ngay khi tin vừa ra ---
    news_trade_override: true          # true = kích hoạt giao dịch theo tin
    news_trade_window_minutes: 3       # Thực hiện trong 3 phút đầu sau khi tin ra
    news_trade_atr_sl_mult: 1.5        # SL = 1.5 × ATR (đủ rộng tránh spike)
    news_trade_atr_tp_mult: 3.5        # TP = 3.5 × ATR  →  RR ≈ 1:2.3
