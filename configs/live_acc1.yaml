    news_trade_atr_tp_mult: 3.5        # TP = 3.5 × ATR  →  RR ≈ 1:2.3

admin:
  canary:
    enabled: false
    volume_fraction: 0.20
    min_lot: 0.01
  auto_rollback:
    enabled: false
    rollback_profile: balanced
    daily_dd_trigger_pct: 3.0
    consecutive_losses_trigger: 4
