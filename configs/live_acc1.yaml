# ─────────────────────────────────────────────────────────────────
# LIVE TRADING CONFIG — Account 1 (ACC1) — COMBO #133 SYNC
# Model:  outputs/acc1_combo133_202604_model.pkl  [frozen 2026-04]
# WF Combo #133: 28 folds Jan2024→Apr2026 | 27/28 profitable | +$78,204
# Synced to WF config: min_conf=0.70, risk=4%, max_pos=3, D1_gate=off
# ─────────────────────────────────────────────────────────────────
app:
  poll_seconds: 60
  model_path:          outputs/acc1_combo133_202604_model.pkl
  scaler_path:         outputs/acc1_combo133_202604_scaler.pkl
  model_meta_path:     outputs/acc1_combo133_202604_meta.json
  training_report_path: outputs/training_report_acc1.json
  training_plot_path:  outputs/training_metrics_acc1.png
  backtest_report_path: outputs/backtest_report_acc1.json
  backtest_trades_path: outputs/backtest_trades_acc1.csv
  backtest_equity_plot_path: outputs/backtest_equity_acc1.png
  backtest_trades_plot_path: outputs/backtest_trades_plot_acc1.png
  walkforward_report_path: outputs/walkforward_report_acc1.json
  walkforward_trades_path: outputs/walkforward_trades_acc1.csv
  paper_trade_log_path: outputs/paper_trade_signals_acc1.csv
  live_learning_log_path: outputs/live_learning_log_acc1.jsonl
  live_closed_trades_path: outputs/live_closed_trades_acc1.csv
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: GC=F
  training_data_source: csv_folder
  live_data_source: bridge
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M15
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4
  execution_timeframe: M5
  bars:
    D1: 100
    H1: 500
    H4: 200
    M30: 300
    M15: 300
    M5: 500
    M1: 200
  timezone: UTC
  enforce_market_open_gate: true
  market_tick_stale_seconds: 300
  market_preopen_alert_minutes: 30
  market_preclose_alert_minutes: 30
  market_preopen_alert_minutes_list: [1440, 30]
  market_preclose_alert_minutes_list: [1440, 30]

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20
  volatility_window: 20
  signal_threshold: 0.60             # V14++ PROFIT — regime-aware sweep best
  sideways_volatility_threshold: 0.20     # atr_percentile — bottom 20% = sideway
  strong_volatility_threshold: 0.80       # atr_percentile — top 20% = strong trend
  news_block_minutes: 0              # Tắt blackout ML feature (dùng news override thay thế)
  rsi_long_threshold: 50             # Less strict than acc2 (52)
  rsi_short_threshold: 50            # Less strict than acc2 (48)
  ict_weight: 0.40
  wyckoff_weight: 0.35
  momentum_weight: 0.25
  min_strategy_score: 0.05
  sideway_min_strategy_score: 0.10
  strong_volatility_min_strategy_score: 0.35
  require_trend_alignment: false    # no_align+sc=0.78: +$68/wk, 86% pos weeks
  force_trade: false
  blocked_hours_utc: [3, 15, 17, 22, 23]
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc: {}
  regime_shutdown_rules:
    - name: monday_early_sell_flow_conflict
      weekdays_utc: [Monday]
      hours_utc: [1, 2]
      sides: [sell]
      volatility_regimes: [1]
      trend_alignment_values: [0]
      trend_strength_max: -0.24
      execution_quality_min: 0.0
    - name: thursday_pm_sell_flow_conflict
      weekdays_utc: [Thursday]
      hours_utc: [16, 17, 18]
      sides: [sell]
      volatility_regimes: [1]
      execution_quality_min: 0.0
    - name: wed_thu_early_buy_trap
      weekdays_utc: [Wednesday, Thursday]
      hours_utc: [3, 4, 5]
      sides: [buy]
      trend_strength_max: -0.4
      execution_quality_max: 0.3
  # Silver Bullet ICT windows
  silver_bullet_enabled: true
  silver_bullet_windows_utc: [[3, 4], [10, 11], [14, 15]]
  silver_bullet_confidence_boost: 0.05  # Slightly higher boost than acc2 (0.03)
  # ADX trend gate
  adx_gate_enabled: true
  adx_min_trend: 15.0              # V14++: relaxed entry gate
  # Regime-specific confidence thresholds
  sideway_min_confidence: 0.70    # COMBO #133: WF-synced (was 0.78)
  volatile_min_confidence: 0.70   # COMBO #133: WF-synced (was 0.78)
  d1_trend_gate: false            # COMBO #133: TẮT — bật thì -87% P&L

risk:
  mode: fixed_fractional
  risk_per_trade: 0.04             # COMBO #133: WF-synced (was 0.05)
  risk_tier_floor: 0.02
  max_open_positions: 3             # COMBO #133: WF-synced (was 2)
  stop_loss_atr_multiple: 1.5
  take_profit_rr: 3.5
  entry_slippage_atr_frac: 0.07    # Shift SL/TP levels by 7% ATR to simulate MT5 fill vs bar.close (G4 fix)
  volatile_take_profit_rr: 5.0     # ACC2 logic: Volatile regime RR 1:5
  sideway_take_profit_rr: 2.5      # Sideways regime RR 1:2.5
  min_confidence: 0.70             # COMBO #133: WF-synced (was 0.78)
  fixed_lot: 0.01
  max_risk_fraction: 0.08           # V14++
  sideway_risk_multiplier: 1.0
  normal_risk_multiplier: 1.0
  strong_volatility_risk_multiplier: 0.70
  kill_switch_enabled: true
  daily_loss_limit_pct: 0.12        # V14++: daily loss limit enabled
  max_drawdown_kill_pct: 0.20
  consecutive_loss_pause_count: 3
  consecutive_loss_cooldown_bars: 12 # V14++: 1h cooldown
  anti_martingale_factor: 0.7       # V14++: sweep best
  anti_martingale_max_reductions: 2
  volatility_risk_scaling_enabled: false  # COMBO #133: TẮT — model wins during ATR spikes
  max_total_exposure_pct: 0.30
  reentry_guard_enabled: true
  reentry_cooldown_bars_after_sl: 3
  reentry_min_distance_atr: 0.35
  # Partial Take Profit — book at 1.5R (better quality exits than 1.0R)
  partial_tp_enabled: true
  partial_tp_rr: 1.2
  partial_tp_pct: 0.5               # Close 50% of position
  risk_throttle_rules:
    - name: monday_0207_all_heavy_throttle
      risk_multiplier: 0.20
      weekdays_utc: [Monday]
      hours_utc: [2, 3, 4, 5, 6, 7]
    - name: monday_1721_all_heavy_throttle
      risk_multiplier: 0.25
      weekdays_utc: [Monday]
      hours_utc: [17, 18, 19, 20, 21]
    - name: tue_wed_thu_0207_all_throttle
      risk_multiplier: 0.35
      weekdays_utc: [Tuesday, Wednesday, Thursday]
      hours_utc: [2, 3, 4, 5, 6, 7]
    - name: tue_wed_thu_1721_all_throttle
      risk_multiplier: 0.40
      weekdays_utc: [Tuesday, Wednesday, Thursday]
      hours_utc: [17, 18, 19, 20, 21]

execution:
  auto_trade: true
  deviation: 20
  magic_number: 20260325            # Unique for acc1
  comment: xauusd-ai-live-acc1-profit
  paper_trade_max_loops: 0          # 0 = run continuously until manually stopped
  paper_data_source: mt5             # Paper test should follow live feed, not static CSV
  close_opposite_on_signal: true

  trailing_sl:
    enabled: true
    breakeven_at_rr: 0.5
    activation_rr: 1.0
    trail_atr_multiple: 1.0

  dca:
    enabled: false
    max_dca_count: 2
    trigger_atr_multiple: 1.5
    lot_multiplier: 1.5
    max_total_risk_pct: 0.03

  exit_model:
    enabled: false
    exit_model_path: "outputs/exit_model_acc1.pkl"
    exit_scaler_path: "outputs/exit_scaler_acc1.pkl"
    exit_model_meta_path: "outputs/exit_model_meta_acc1.json"
    exit_threshold: 0.65
    min_unrealized_rr: 0.80
    exit_min_hold_bars: 4
    exit_label_horizon: 8
    exit_label_threshold_rr: 0.50
    max_entry_samples: 8000
    also_cut_losses: false
    min_loss_rr: -0.50


training:
  # ── DATE-BASED SPLIT — wider range for more diverse training ────────────────
  train_start_date: "2022-01-01"    # ACC1: start from 2022 for more data (~4yr)
  train_end_date:   "2026-03-08"
  test_start_date:  "2026-03-09"
  test_end_date:    null
  train_split: 0.70
  use_sltp_label: true
  sltp_label_max_horizon: 96         # 8h horizon (tighter than acc2's 192) → faster hits
  label_tp_rr: 1.5                   # ACC1: lower RR label → more positive samples
  label_horizon: 24                  # 2h horizon for signal validity
  min_return_threshold: 0.0008       # Lower → even more positive labels
  retrain_on_startup: false          # Dùng model freeze hiện tại ngay khi bot khởi động
  live_learning_enabled: false       # Tắt self-learn — dùng model cố định
  live_learning_interval_minutes: 60
  live_learning_min_new_bars: 12
  live_learning_min_rows: 500
  min_self_learning_roc_auc: 0.53
  optimize_threshold: false          # Giữ threshold 0.62 cố định theo benchmark ACC1

notifications:
  telegram_enabled: true
  verbose_message: true

