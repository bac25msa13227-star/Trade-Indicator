# ─────────────────────────────────────────────────────────────────
# TRAINING CONFIG — Account 1 (ACC1 aggressive model)
# Goal: high-frequency model that trades on all market conditions
# Key changes vs acc2:
#   - label_tp_rr: 1.5 (more achievable → more positive labels → higher recall)
#   - sltp_label_max_horizon: 96 (8h window → tighter, faster hits)
#   - train_start_date: 2022-01-01 (4 years → more diverse folds)
#   - label_horizon: 24 (2h signal validity)
# Result: WF folds should show stable precision 50%+ with threshold 0.55-0.65
# ─────────────────────────────────────────────────────────────────
app:
  poll_seconds: 300
  model_path:          outputs/model_acc1.pkl
  scaler_path:         outputs/scaler_acc1.pkl
  model_meta_path:     outputs/model_meta_acc1.json
  training_report_path: outputs/training_report_acc1.json
  training_plot_path:  outputs/training_metrics_acc1.png
  backtest_report_path: outputs/backtest_report_acc1.json
  backtest_trades_path: outputs/backtest_trades_acc1.csv
  backtest_equity_plot_path: outputs/backtest_equity_acc1.png
  backtest_trades_plot_path: outputs/backtest_trades_plot_acc1.png
  walkforward_report_path: outputs/walkforward_report_acc1.json
  walkforward_trades_path: outputs/walkforward_trades_acc1.csv
  paper_trade_log_path: outputs/paper_trade_signals_acc1.csv
  live_learning_log_path: outputs/live_learning_log_acc1.jsonl
  live_closed_trades_path: outputs/live_closed_trades_acc1.csv
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: GC=F
  training_data_source: csv_folder
  live_data_source: yfinance
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M15
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4
  execution_timeframe: M5
  bars:
    D1: 100
    H1: 500
    H4: 200
    M15: 300
    M5: 500
    M1: 200
  timezone: UTC

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20
  volatility_window: 20
  signal_threshold: 0.50
  sideways_volatility_threshold: 0.003
  strong_volatility_threshold: 0.016
  news_block_minutes: 0
  rsi_long_threshold: 50
  rsi_short_threshold: 50
  ict_weight: 0.40
  wyckoff_weight: 0.35
  momentum_weight: 0.25
  min_strategy_score: 0.05
  sideway_min_strategy_score: 0.08
  strong_volatility_min_strategy_score: 0.08
  require_trend_alignment: false
  force_trade: false
  blocked_hours_utc: [22, 23]
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc:
    Friday: [20, 21, 22, 23]
  silver_bullet_enabled: true
  silver_bullet_windows_utc: [[3, 4], [10, 11], [14, 15]]
  silver_bullet_confidence_boost: 0.05
  adx_gate_enabled: true
  adx_min_trend: 15.0
  sideway_min_confidence: 0.52
  volatile_min_confidence: 0.50

risk:
  mode: fixed_fractional
  risk_per_trade: 0.05
  risk_tier_floor: 0.025
  max_open_positions: 3
  stop_loss_atr_multiple: 1.5
  take_profit_rr: 3.5
  volatile_take_profit_rr: 4.5
  sideway_take_profit_rr: 2.5
  min_confidence: 0.50
  fixed_lot: 0.01
  max_risk_fraction: 0.07
  sideway_risk_multiplier: 0.5
  normal_risk_multiplier: 1.0
  strong_volatility_risk_multiplier: 0.75
  daily_loss_limit_pct: 0.0
  max_drawdown_kill_pct: 0.20
  consecutive_loss_pause_count: 4
  consecutive_loss_cooldown_bars: 6
  anti_martingale_factor: 0.65
  anti_martingale_max_reductions: 3
  max_total_exposure_pct: 0.12
  partial_tp_enabled: true
  partial_tp_rr: 1.5
  partial_tp_pct: 0.5

execution:
  auto_trade: false                  # Training mode — no live trades
  deviation: 20
  magic_number: 20260325
  comment: xauusd-ai-train-acc1

  trailing_sl:
    enabled: true
    breakeven_at_rr: 0.5
    activation_rr: 1.0
    trail_atr_multiple: 1.0

  dca:
    enabled: false

  exit_model:
    enabled: false

training:
  retrain_on_startup: true          # YES — this config is for training
  # ── DATE SPLIT: 4 years of data for diverse conditions ──────────────────
  train_start_date: "2022-01-01"    # 4yr: includes 2022 bear, 2023-2024 recovery, 2025-2026 bull
  train_end_date:   "2026-03-08"
  test_start_date:  "2026-03-09"
  test_end_date:    null
  train_split: 0.70
  use_sltp_label: true
  # ── KEY PARAMETER: lower label_tp_rr → more positive labels → better recall
  # With 1.5R target: ~50-55% of bars will be positive (vs 43% at 2.0R)
  # This ensures model sees enough winning examples across all market regimes
  sltp_label_max_horizon: 96        # 8h window to hit 1.5R (tight but achievable)
  label_tp_rr: 1.5                  # ACC2 uses 2.0 — we use 1.5 → more signals
  label_horizon: 24                 # 2h for signal check (M15 × 24 = 6h)
  min_return_threshold: 0.0008      # Lower threshold → even more positive labels
  live_learning_enabled: true
  live_learning_min_new_bars: 12
  live_learning_min_rows: 500
  save_dataset: true
  dataset_path: outputs/training_dataset_acc1.csv
  optimize_threshold: true
  # ── Walk-forward ──────────────────────────────────────────────────────────
  # Run: docker compose run --rm train python src/xauusd_ai/main.py walkforward
  #      --config configs/train_acc1.yaml
