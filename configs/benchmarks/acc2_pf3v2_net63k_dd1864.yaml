# ACC2 v2 PF3 profile lock (wf_pf3_v2_search most-trades recommended)
# Target WF (locked artifact): Net 63,164.18 | DD 18.64% | PF 3.9679 | Trades 182 | WR 81.87%
# Vs baseline (publish): Net 35,714.67 | DD 22.81% | PF 1.6547 -> IMPROVED ALL 3 METRICS
# compound_cap=50.0 (standard, per-fold 50x ceiling relative to fold start balance)
# template=focus_hours: allowed=[0,1,5,6,7,13,14,20,21] each weekday

app:
  poll_seconds: 60
  model_path: outputs/acc2_expand_net35714_dd2281_model.pkl
  scaler_path: outputs/acc2_pf3v2_net63k_dd1864_scaler.pkl
  model_meta_path: outputs/acc2_pf3v2_net63k_dd1864_model_meta.json
  walkforward_report_path: outputs/acc2_pf3v2_net63k_dd1864_walkforward_report.json
  walkforward_trades_path: outputs/acc2_pf3v2_net63k_dd1864_walkforward_trades.csv
  paper_trade_log_path: outputs/paper_trade_signals_acc2.csv
  live_learning_log_path: outputs/live_learning_log_acc2.jsonl
  live_closed_trades_path: outputs/live_closed_trades_acc2.csv
  log_level: INFO

market:
  symbol: XAUUSDm
  training_symbol: GC=F
  training_data_source: csv
  csv_data_path: src/xauusd_ai/real_data/XAUUSD_M5.csv
  live_data_source: yfinance
  csv_folder_path: src/xauusd_ai/real_data
  csv_timeframe: M5
  higher_timeframe: D1
  mid_timeframe: H1
  structure_timeframe: H4
  execution_timeframe: M5
  bars:
    D1: 100
    H1: 500
    H4: 200
    M30: 300
    M15: 300
    M5: 500
    M1: 200
  timezone: UTC
  enforce_market_open_gate: true
  market_tick_stale_seconds: 300
  market_preopen_alert_minutes: 30
  market_preclose_alert_minutes: 30
  market_preopen_alert_minutes_list: [1440, 30]
  market_preclose_alert_minutes_list: [1440, 30]

strategy:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  liquidity_lookback: 15
  swing_lookback: 20
  volatility_window: 20
  signal_threshold: 0.80
  sideways_volatility_threshold: 0.003
  strong_volatility_threshold: 0.016
  news_block_minutes: 0
  rsi_long_threshold: 52
  rsi_short_threshold: 48
  ict_weight: 0.40
  wyckoff_weight: 0.35
  momentum_weight: 0.25
  min_strategy_score: 0.15
  sideway_min_strategy_score: 0.05
  strong_volatility_min_strategy_score: 0.20
  require_trend_alignment: false
  force_trade: false
  blocked_hours_utc: []
  blocked_weekdays_utc: []
  blocked_weekday_hours_utc: {}
  allowed_weekday_hours_utc:
    Monday: [0, 1, 5, 6, 7, 13, 14, 20, 21]
    Tuesday: [0, 1, 5, 6, 7, 13, 14, 20, 21]
    Wednesday: [0, 1, 5, 6, 7, 13, 14, 20, 21]
    Thursday: [0, 1, 5, 6, 7, 13, 14, 20, 21]
    Friday: [0, 1, 5, 6, 7, 13, 14, 20, 21]
  silver_bullet_enabled: true
  silver_bullet_windows_utc: [[3, 4], [10, 11], [14, 15]]
  silver_bullet_confidence_boost: 0.03
  adx_gate_enabled: false
  adx_min_trend: 22.0
  sideway_min_confidence: 0.85
  volatile_min_confidence: 0.75
  regime_shutdown_rules: []

risk:
  mode: fixed_fractional
  risk_per_trade: 0.06
  risk_tier_floor: 0.03
  max_open_positions: 2
  stop_loss_atr_multiple: 1.2
  take_profit_rr: 10.0
  sideway_take_profit_rr: 9.0
  volatile_take_profit_rr: 11.0
  min_confidence: 0.75
  fixed_lot: 0.01
  max_risk_fraction: 0.065
  sideway_risk_multiplier: 0.20
  normal_risk_multiplier: 1.0
  strong_volatility_risk_multiplier: 1.0
  spread_cost_rr: 0.01
  slippage_rr: 0.01
  commission_rr: 0.0
  kill_switch_enabled: true
  daily_loss_limit_pct: 0.015
  max_drawdown_kill_pct: 0.15
  consecutive_loss_pause_count: 3
  consecutive_loss_cooldown_bars: 12
  anti_martingale_factor: 0.7
  anti_martingale_max_reductions: 3
  max_total_exposure_pct: 0.12
  reentry_guard_enabled: true
  reentry_cooldown_bars_after_sl: 1
  reentry_min_distance_atr: 0.35
  partial_tp_enabled: false
  partial_tp_rr: 1.5
  partial_tp_pct: 0.5
  compound_cap: 50.0
  risk_throttle_rules: []

execution:
  auto_trade: true
  deviation: 20
  magic_number: 20260406
  comment: xauusd-ai-acc2-pf3v2-net63k
  paper_trade_max_loops: 0
  paper_data_source: yfinance
  close_opposite_on_signal: true
  trailing_sl:
    enabled: true
    breakeven_at_rr: 0.5
    activation_rr: 1.0
    trail_atr_multiple: 1.0

training:
  train_start_date: "2022-01-01"
  train_end_date: "2026-03-08"
  test_start_date: "2026-03-09"
  test_end_date: null
  train_split: 0.70
  use_sltp_label: true
  sltp_label_max_horizon: 96
  label_tp_rr: 1.5
  label_horizon: 24
  min_return_threshold: 0.0008
  retrain_on_startup: false
  live_learning_enabled: false
  optimize_threshold: false
  save_dataset: true
  dataset_path: outputs/task4_training_dataset_acc2.csv
  walkforward_train_size: 24000
  walkforward_test_size: 4000
  walkforward_step_size: 4000
  walkforward_max_combinations: 30
  walkforward_max_folds_per_combination: 8
  backtest_initial_balance: 200.0

notifications:
  telegram_enabled: true
  verbose_message: true

integrations:
  mt5:
    enabled: true
    login_env: MT5_LOGIN
    password_env: MT5_PASSWORD
    server_env: MT5_SERVER
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  news:
    enabled: true
    provider: forexfactory
    minutes_before: 2
    minutes_after: 5
    trade_before_news: false
    trade_after_news: true
    high_impact_only: true
    currencies: [USD]
    news_trade_override: false
